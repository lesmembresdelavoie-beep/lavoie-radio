<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Képha — Asistan La Voie</title>
<!-- Version revue avec ajouts FAQ La Voie : chrétiens/mashiyḥim, réunions/qehilah, rôle des femmes, autres brebis. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
#kepha-btn{position:fixed;bottom:1.8rem;right:1.8rem;z-index:9999;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#c9a84c,#e8cb7a);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(201,168,76,0.4);transition:all 0.3s;animation:pulse-gold 3s ease-in-out infinite}
#kepha-btn:hover{transform:scale(1.08);box-shadow:0 6px 32px rgba(201,168,76,0.6)}
#kepha-btn svg{width:28px;height:28px;fill:#060d1a}
@keyframes pulse-gold{0%,100%{box-shadow:0 4px 24px rgba(201,168,76,0.4),0 0 0 0 rgba(201,168,76,0.3)}50%{box-shadow:0 4px 24px rgba(201,168,76,0.5),0 0 0 10px rgba(201,168,76,0)}}
#kepha-window{position:fixed;bottom:5.5rem;right:1.8rem;z-index:9998;width:370px;max-height:570px;background:linear-gradient(180deg,#060d1a 0%,#0a1428 100%);border:1px solid rgba(201,168,76,0.3);border-radius:4px;display:flex;flex-direction:column;box-shadow:0 16px 60px rgba(0,0,0,0.7);transform:translateY(20px) scale(0.95);opacity:0;pointer-events:none;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1)}
#kepha-window.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all}
#kepha-header{padding:1rem 1.2rem;background:linear-gradient(135deg,rgba(13,35,71,0.9),rgba(6,13,26,0.95));border-bottom:1px solid rgba(201,168,76,0.2);display:flex;align-items:center;gap:0.8rem;border-radius:4px 4px 0 0}
.kepha-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#c9a84c,#8a6a1f);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;border:1px solid rgba(201,168,76,0.4)}
.kepha-info{flex:1}
.kepha-nom{font-family:'Cinzel',serif;font-size:0.9rem;font-weight:600;color:#e8cb7a;letter-spacing:0.08em}
.kepha-titre{font-family:'EB Garamond',serif;font-style:italic;font-size:0.78rem;color:#b8c8dc;opacity:0.7}
.kepha-status{display:flex;align-items:center;gap:0.3rem;font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.15em;color:#c9a84c;text-transform:uppercase;opacity:0.7}
.kepha-dot{width:6px;height:6px;background:#4caf50;border-radius:50%;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
#kepha-close{background:none;border:none;color:#b8c8dc;cursor:pointer;font-size:1.1rem;opacity:0.5;transition:opacity 0.2s;padding:0.2rem}
#kepha-close:hover{opacity:1}
#kepha-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.8rem;scrollbar-width:thin;scrollbar-color:rgba(201,168,76,0.2) transparent;max-height:350px}
#kepha-messages::-webkit-scrollbar{width:4px}
#kepha-messages::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.2);border-radius:2px}
.msg{display:flex;flex-direction:column;gap:0.2rem;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-bubble{padding:0.75rem 1rem;border-radius:2px;font-family:'EB Garamond',serif;font-size:0.97rem;line-height:1.7;max-width:92%}
.msg.kepha .msg-bubble{background:linear-gradient(135deg,rgba(13,35,71,0.6),rgba(6,13,26,0.7));border:1px solid rgba(201,168,76,0.15);border-left:2px solid #c9a84c;color:#e8f0f8;align-self:flex-start}
.msg.user .msg-bubble{background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(201,168,76,0.08));border:1px solid rgba(201,168,76,0.2);color:#f7edcc;align-self:flex-end;text-align:right}
.msg-label{font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.18em;text-transform:uppercase;opacity:0.45}
.msg.kepha .msg-label{color:#c9a84c}
.msg.user .msg-label{color:#b8c8dc;align-self:flex-end}
.typing-bubble{background:linear-gradient(135deg,rgba(13,35,71,0.6),rgba(6,13,26,0.7));border:1px solid rgba(201,168,76,0.15);border-left:2px solid #c9a84c;padding:0.75rem 1rem;border-radius:2px;display:flex;gap:4px;align-items:center;align-self:flex-start}
.typing-dot{width:6px;height:6px;background:#c9a84c;border-radius:50%;opacity:0.4;animation:typing 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,100%{opacity:0.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
#kepha-suggestions{padding:0.6rem 1rem 0;display:flex;flex-wrap:wrap;gap:0.4rem}
.suggestion-btn{font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.3rem 0.7rem;background:transparent;border:1px solid rgba(201,168,76,0.2);color:#c9a84c;cursor:pointer;transition:all 0.2s;border-radius:1px}
.suggestion-btn:hover{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.4)}
#kepha-input-zone{padding:0.8rem 1rem;border-top:1px solid rgba(201,168,76,0.15);display:flex;gap:0.6rem;align-items:center;background:rgba(6,13,26,0.8);border-radius:0 0 4px 4px}
#kepha-input{flex:1;background:rgba(13,35,71,0.4);border:1px solid rgba(201,168,76,0.2);border-radius:2px;padding:0.6rem 0.9rem;font-family:'EB Garamond',serif;font-size:0.95rem;color:#e8f0f8;outline:none;resize:none;min-height:40px;max-height:100px;transition:border-color 0.2s}
#kepha-input::placeholder{color:rgba(184,200,220,0.4);font-style:italic}
#kepha-input:focus{border-color:rgba(201,168,76,0.45)}
#kepha-send{width:40px;height:40px;border-radius:50%;background:#c9a84c;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
#kepha-send:hover{background:#e8cb7a;transform:scale(1.05)}
#kepha-send svg{width:16px;height:16px;fill:#060d1a}
#kepha-notif{position:absolute;top:-4px;right:-4px;width:18px;height:18px;background:#ff4444;border-radius:50%;font-size:0.6rem;color:white;display:none;align-items:center;justify-content:center;font-family:'Cinzel',serif}
@media(max-width:480px){#kepha-window{width:calc(100vw - 2rem);right:1rem}}

.kepha-avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block}

</style>
</head>

function normalize(s) {
  return s.toLowerCase()
    .replace(/[?!.,;:]/g,'')
    .replace(/[èéêë]/g,'e')
    .replace(/[àâä]/g,'a')
    .replace(/[ôö]/g,'o')
    .replace(/[ûü]/g,'u')
    .replace(/[îï]/g,'i')
    .replace(/[ʿʾ]/g,"'")
    .trim();
}

function findResponse(input) {
  const q = normalize(input);
  for (const item of KB) {
    for (const kw of item.keys) {
      if (q.includes(normalize(kw))) return item.rep;
    }
  }
  return null;
}

function defaultResponse(input) {
  const q = normalize(input);
  if (q.includes('merci') || q.includes('mesi') || q.includes('todah') || q.includes('mèsi')) {
    return "Barukh Yahawah ! Mèsi pou konfyans ou akhi. Si ou gen lòt kesyon, mwen la. Shalom ! ✦";
  }
  if (q.includes('shalom') || q.includes('bonjou') || q.includes('bonswa') || q.includes('hello') || q.includes('sak pase')) {
    return "Shalom ! Kijan mwen ka ede ou jodi a ?\n\nPoze mwen nenpòt kesyon sou La Voie, ansèyman yo, vokabilè ibriy la oswa kijan pou kontakte nou. ✦";
  }
  if (q.includes('ki ou ye') || q.includes('kiyès ou ye') || q.includes('qui es-tu') || q.includes('c est qui')) {
    return "Mwen se <strong>Képha</strong> — asistan ofisyèl Les Membres de La Voie.\n\nMwen la pou ede ou konprann ansèyman La Voie, reponn kesyon ou yo ak gide ou nan ressous Qehilah a. ✦";
  }
  return "Mwen paka jwenn repons pou kesyon sa a nan baz konesans mwen aktyèlman.\n\nPou pi bon repons, ou ka :\n🌐 Vizite <strong>lavoie.world</strong>\n📧 Kontakte nou : lesmembresdelavoie@gmail.com\n✈ Telegram : t.me/lesmembresdelavoie\n\nShalom ! ✦";
}

let isOpen = false;

function toggleKepha() {
  isOpen = !isOpen;
  const win = document.getElementById('kepha-window');
  document.getElementById('kepha-notif').style.display = 'none';
  if (isOpen) {
    win.classList.add('open');
    setTimeout(() => document.getElementById('kepha-input').focus(), 400);
  } else {
    win.classList.remove('open');
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendSuggestion(btn) {
  document.getElementById('kepha-input').value = btn.textContent.replace(' ?','');
  document.getElementById('kepha-suggestions').style.display = 'none';
  sendMessage();
}

function sendMessage() {
  const input = document.getElementById('kepha-input');
  const msg = input.value.trim();
  if (!msg) return;
  addMessage('user', msg);
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('kepha-suggestions').style.display = 'none';
  const typingEl = addTyping();
  setTimeout(() => {
    typingEl.remove();
    const rep = findResponse(msg) || defaultResponse(msg);
    addMessage('kepha', rep);
  }, 700 + Math.random() * 500);
}

function addMessage(type, text) {
  const msgs = document.getElementById('kepha-messages');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  const label = document.createElement('span');
  label.className = 'msg-label';
  label.textContent = type === 'kepha' ? 'Képha' : 'Ou';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = text.replace(/\n/g,'<br>');
  div.appendChild(label);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addTyping() {
  const msgs = document.getElementById('kepha-messages');
  const div = document.createElement('div');
  div.className = 'msg kepha';
  div.innerHTML = '<span class="msg-label">Képha</span><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

setTimeout(() => {
  if (!isOpen) {
    const n = document.getElementById('kepha-notif');
    n.style.display = 'flex';
  }
}, 4000);
</script>
