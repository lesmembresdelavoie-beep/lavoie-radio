<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bleu-nuit:#0d2347;--or:#c9a84c;--or-pale:#e8d08a;--parchemin:#f5f0e8;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bleu-nuit);font-family:'Cormorant Garamond',Georgia,serif;color:var(--parchemin);}
#ecran-accueil{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1a3a6b 0%,#0d2347 60%,#060f1e 100%);transition:opacity 1.2s ease;}

.accueil-sous{font-size:clamp(0.9rem,2.5vw,1.1rem);color:var(--or-pale);letter-spacing:0.1em;text-align:center;margin-bottom:3rem;font-style:italic;opacity:0.8;}
.accueil-btn{padding:1rem 2.5rem;border:1px solid var(--or);border-radius:999px;background:rgba(201,168,76,0.1);color:var(--or-pale);font-family:'Cinzel',serif;font-size:clamp(0.85rem,2.5vw,1rem);letter-spacing:0.15em;cursor:pointer;transition:all 0.3s;animation:puls 2.2s ease-in-out infinite;}
.accueil-btn:hover{background:rgba(201,168,76,0.25);}

#scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a3a6b 0%,#0d2347 55%,#060f1e 100%);overflow:hidden;}
.etoile{position:absolute;border-radius:50%;background:rgba(232,208,138,0.7);animation:scintille ease-in-out infinite;}
@keyframes scintille{0%,100%{opacity:0.15;transform:scale(0.8);}50%{opacity:0.9;transform:scale(1.3);}}

.slide.actif{display:flex;}
@keyframes slideIn{0%{opacity:0;transform:translateY(28px);}100%{opacity:1;transform:translateY(0);}}
@keyframes slideOut{0%{opacity:1;}100%{opacity:0;transform:translateY(-24px);}}
.slide.sortant{animation:slideOut 0.9s ease forwards;}
.badge-jou{font-family:'Cinzel',serif;font-size:clamp(0.65rem,2vw,0.8rem);letter-spacing:0.22em;color:var(--or);border:1px solid rgba(201,168,76,0.4);border-radius:999px;padding:0.35rem 1.1rem;background:rgba(201,168,76,0.08);text-transform:uppercase;}
.sep{width:60px;height:1px;background:linear-gradient(to right,transparent,var(--or),transparent);}
.verset{font-size:clamp(1.15rem,3.5vw,1.65rem);font-style:italic;line-height:1.65;color:var(--parchemin);max-width:680px;text-shadow:0 2px 12px rgba(0,0,0,0.5);}
.ref{font-family:'Cinzel',serif;font-size:clamp(0.7rem,2vw,0.85rem);letter-spacing:0.18em;color:var(--or-pale);opacity:0.85;}
.ornement{font-size:1.2rem;color:var(--or);opacity:0.6;}
.commentaire{font-size:clamp(0.88rem,2.5vw,1.05rem);line-height:1.85;color:rgba(245,240,232,0.88);max-width:680px;text-align:justify;hyphens:auto;border-left:2px solid rgba(201,168,76,0.35);padding-left:1.2rem;}
.liy-final{font-size:clamp(0.9rem,2.5vw,1.08rem);font-style:italic;color:var(--or-pale);max-width:620px;line-height:1.6;padding:1rem 1.5rem;border:1px solid rgba(201,168,76,0.3);border-radius:8px;background:rgba(201,168,76,0.06);}

.slide-illus img{width:min(400px,85vw);max-height:75vh;object-fit:contain;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,0.7),0 0 0 1px rgba(201,168,76,0.25);}
#nav-bas{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:1rem;padding:1.2rem 1rem 1.8rem;background:linear-gradient(to top,rgba(6,15,30,0.95),transparent);}
.btn-nav{width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,168,76,0.5);background:rgba(13,35,71,0.8);color:var(--or-pale);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.25s;}
.btn-nav:hover{background:rgba(201,168,76,0.2);border-color:var(--or);}

#indicateur{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.15em;color:var(--or-pale);opacity:0.7;min-width:60px;text-align:center;}
#btn-muzik{position:fixed;bottom:1.5rem;right:1.2rem;z-index:30;width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,168,76,0.45);background:rgba(13,35,71,0.85);color:var(--or-pale);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;}
#barre-prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(to right,var(--or),var(--or-pale));transition:width 0.6s ease;z-index:30;}
@media(max-width:600px){.commentaire{text-align:left;}#slides-wrap{padding:1.2rem 1rem;}}

<script>
var TEKS_DATA = [{"mois": "Siban", "annee": 5786, "jours": [{"jour": 1, "soir_debut": "2026-05-18", "soir_fin": "2026-05-19", "ref": "Tehillim 1:1", "texte": "« Heureux l'homme qui ne marche pas selon le conseil des mechants, qui ne s'arrête pas sur la voie des pécheurs et qui ne s'assoit pas en compagnie des moqueurs. »", "texte_kw": "« Benediksyon pou nonm ki pa mache dapre konsèy mechan yo, ki pa kanpe nan chemen pechè yo, epi ki pa chita nan konpayi moun k ap pase tout bagay nan betiz. »"}, {"jour": 2, "soir_debut": "2026-05-19", "soir_fin": "2026-05-20", "ref": "Tehillim 19:8", "texte": "« La Torah de Yahawah est parfaite, elle restaure l'âme. Le témoignage de Yahawah est sûr, il rend sage le simple. »", "texte_kw": "« Torah Yahawah a pafè, li restore nanm nan. Temwayaj Yahawah la sèten, li bay saj moun ki senp. »"}, {"jour": 3, "soir_debut": "2026-05-20", "soir_fin": "2026-05-21", "ref": "Mishle 3:5-6", "texte": "« Confie-toi en Yahawah de tout ton cœur et ne t'appuie pas sur ta propre intelligence. Reconnais-le dans toutes tes voies, et il aplanira tes sentiers. »", "texte_kw": "« Mete konfyans ou nan Yahawah ak tout kè ou, pa konte sou entèlijans pa ou. Rekonèt li nan tout chemen ou yo, epi li pral aplani wout ou yo. »"}, {"jour": 4, "soir_debut": "2026-05-21", "soir_fin": "2026-05-22", "ref": "Yeshayahou 40:31", "texte": "« Ceux qui espèrent en Yahawah renouvellent leur force. Ils prennent leur envol comme des aigles. Ils courent sans se fatiguer, ils marchent sans défaillir. »", "texte_kw": "« Moun ki espere nan Yahawah ap renouvle fòs yo. Y ap pran vòl tankou malfini. Y ap kouri san yo pa fatige, y ap mache san yo pa febli. »"}, {"jour": 5, "soir_debut": "2026-05-22", "soir_fin": "2026-05-23", "ref": "Devarim 6:4-5", "texte": "« Écoute, Yisra'el : Yahawah notre Elohim est le seul Yahawah. Tu aimeras Yahawah ton Elohim de tout ton cœur, de toute ton âme et de toute ta force. »", "texte_kw": "« Koute, Yisra'el : Yahawah Elohim nou an se sèl Yahawah. W ap renmen Yahawah Elohim ou a ak tout kè ou, ak tout nanm ou ak tout fòs ou. »"}, {"jour": 6, "soir_debut": "2026-05-23", "soir_fin": "2026-05-24", "ref": "Maʿasei 2:1-4", "texte": "« Le jour de Shabouʿot étant arrivé, ils étaient tous ensemble dans le même lieu. Soudain il vint du ciel un bruit comme celui d'un vent violent, et il remplit toute la maison où ils étaient assis. »", "texte_kw": "« Lè jou Shabouʿot rive a, yo te tout ansanm nan menm kote a. Toudenkou yon bri soti nan syèl tankou yon van fò, li ranpli tout kay kote yo te chita a. »"}, {"jour": 7, "soir_debut": "2026-05-24", "soir_fin": "2026-05-25", "ref": "Tehillim 92:1-2", "texte": "« Il est bon de louer Yahawah, et de chanter à ton Nom, ô Très-Haut — d'annoncer le matin ta grâce, et ta fidélité pendant les nuits. »", "texte_kw": "« Li bon pou n chante lwanj pou Yahawah, pou n chante pou Non ou, o Trè-Wo — pou n anonse maten an gras ou, ak fidèlite ou pandan lannuit yo. »"}, {"jour": 8, "soir_debut": "2026-05-25", "soir_fin": "2026-05-26", "ref": "Mishle 4:23", "texte": "« Par-dessus tout ce que tu gardes, garde ton cœur, car de lui viennent les sources de la vie. »", "texte_kw": "« Nan tout bagay ou ap veye, veye kè ou, paske se nan li sous lavi yo soti. »"}, {"jour": 9, "soir_debut": "2026-05-26", "soir_fin": "2026-05-27", "ref": "Romiyim 8:28", "texte": "« Nous savons que toutes choses concourent au bien de ceux qui aiment Elohim, de ceux qui sont appelés selon son dessein. »", "texte_kw": "« Nou konnen ke tout bagay travay ansanm pou byenfè moun ki renmen Elohim, moun ki rele dapre plan li. »"}, {"jour": 10, "soir_debut": "2026-05-27", "soir_fin": "2026-05-28", "ref": "Philippiyim 4:6-7", "texte": "« Ne vous inquiétez de rien, mais en toutes choses faites connaître vos besoins à Elohim par des prières et des supplications avec des actions de grâces. »", "texte_kw": "« Pa enkyete pou anyen, men nan tout bagay fè Elohim konnen bezwen ou yo pa lapriyè ak siplikasyon ak remèsiman. »"}, {"jour": 11, "soir_debut": "2026-05-28", "soir_fin": "2026-05-29", "ref": "Yaʿaqov 1:5", "texte": "« Si quelqu'un d'entre vous manque de sagesse, qu'il la demande à Elohim, qui donne à tous simplement et sans reproche, et elle lui sera donnée. »", "texte_kw": "« Si youn nan nou manke sajès, mande l bay Elohim, ki bay tout moun san ezitasyon ak san repwòch, epi y ap ba li l. »"}, {"jour": 12, "soir_debut": "2026-05-29", "soir_fin": "2026-05-30", "ref": "Mattiyahu 6:33", "texte": "« Cherchez premièrement le royaume et la justice d'Elohim, et toutes ces choses vous seront données par-dessus. »", "texte_kw": "« Chèche premye wayòm Elohim a ak jistis li, epi tout lòt bagay sa yo ap ban nou anplis. »"}, {"jour": 13, "soir_debut": "2026-05-30", "soir_fin": "2026-05-31", "ref": "Tehillim 27:1", "texte": "« Yahawah est ma lumière et mon salut — de qui aurais-je crainte ? Yahawah est le soutien de ma vie — de qui aurais-je frayeur ? »", "texte_kw": "« Yahawah se limyè mwen ak delivrans mwen — kisa m ta pè ? Yahawah se sipò lavi mwen — kisa k ta fè m tranble ? »"}, {"jour": 14, "soir_debut": "2026-05-31", "soir_fin": "2026-06-01", "ref": "Ibriyim 5:14", "texte": "« Gwo manje se pou moun ki gen matirite, pou moun ki rive fè diferans ant sa ki byen ak sa ki mal paske yo antrene kapasite yo genyen pou yo gen bon jijman an afòs yo sèvi avè l. »", "texte_kw": "« Gwo manje se pou moun ki gen matirite, pou moun ki rive fè diferans ant sa ki byen ak sa ki mal paske yo antrene kapasite yo genyen pou yo gen bon jijman an afòs yo sèvi avè l. »"}]}, {"mois": "Rebi'i", "annee": 5786, "jours": [{"jour": 1, "soir_debut": "2026-06-16", "soir_fin": "2026-06-17", "ref": "Romiyim 5:10", "texte_kw": "« Paske, si lè nou te ènmi 'Èlohim, nou te vin rekonsilye avè l grasa lanmò Pitit li a, alewè pou kounye a nou vin rekonsilye avè l! »"}, {"jour": 2, "soir_debut": "2026-06-17", "soir_fin": "2026-06-18", "ref": "2 Corinthiyim 7:10", "texte_kw": "« Anfèt, tristès ki ann akò ak volonte 'Èlohim pwodui yon teshoubah ki mennen nan delivrans, e yon moun pa bezwen regrèt sa; men tristès ki soti nan monn nan pwodui lanmò. »"}, {"jour": 3, "soir_debut": "2026-06-18", "soir_fin": "2026-06-19", "ref": "Ibriyim 10:33", "texte_kw": "« Gen lè yo te fè nou sibi jouman ak soufrans devan tout moun; gen lòt lè, nou te chwazi soutni moun ki t ap pase anba menm eprèv sa yo. »"}, {"jour": 4, "soir_debut": "2026-06-19", "soir_fin": "2026-06-20", "ref": "Maʿasei 18:8", "texte_kw": "« Crispus, responsab beit haknesset la, te vin demontre li gen émounah nan Adôn nan ansanm ak tout moun lakay li. Menm jan an tou, anpil moun nan Corinthe ki te tande Dabar la te vin gen émounah epi yo te thabalé. »", "commentaire": "Lè shilliaḥ Šāʾūl te rive Corinthe, li te pase anpil tan ap anonse Besorah Tobah a bay moun nan vil la. Okòmansman, li te rankontre opozisyon nan mitan kèk moun, men sa pa t anpeche Dabar Yahawah la kontinye fè efè sou anpil lòt. Se nan kontèks sa a Crispus, responsab beit haknesset la, ansanm ak tout moun lakay li, te vin demontre yo gen émounah nan Yahushuʿah.\n\nVèsè a ajoute ke anpil lòt moun nan Corinthe te suiv menm chemen an. Yo te kòmanse pa koute Dabar la, apre sa yo te devlope émounah, epi finalman yo te thabalé. Lòd sa a montre émounah pa t baze sou tradisyon oswa presyon sosyal, men sou konpreyansyon ak akseptasyon Dabar Yahawah la.\n\nPou Les Membres de La Voie yo, pasaj sa a montre enpòtans pou yon moun koute Dabar Yahawah la avèk yon kè ouvè. Se lè Dabar la antre nan kè yon moun li kapab devlope yon émounah ki solid epi pran desizyon pou l mache nan chemen Yahushuʿah la.\n\nEgzanp Crispus montre tou pozisyon oswa responsabilite yon moun pa dwe anpeche l aksepte verite a. Malgre li te gen yon fonksyon enpòtan nan beit haknesset la, li te dispoze suiv sa Dabar Yahawah la te montre l.\n\nPou tal'midim Yahushuʿah yo jodi a, pasaj sa a raple yo ke émounah reyèl la dwe mennen nan aksyon. Menm jan moun Corinthe yo te koute, yo te kwè epi yo te thabalé, chak moun ki resevwa Dabar la dwe kite l transfòme lavi li. Se konsa qehilah la kontinye grandi, pa sèlman an kantite, men sitou nan fidelite ak matirite roḥanit.", "liy_final": "Émounah reyèl la pa rete nan pawòl sèlman; li mennen nan aksyon ki montre yon moun vrèman aksepte Dabar Yahawah la epi li dispoze kite l transfòme lavi li.", "mois": "Rebi'i"}, {"jour": 5, "soir_debut": "2026-06-20", "soir_fin": "2026-06-21", "ref": "Yaʿaqob 1:5", "texte_kw": "« Si youn nan nou manke bon konprann, se pou l kontinye mande 'Èlohim li, e l ap ba li l, paske l donan ak tout moun, e li pa fè repwòch. »", "commentaire": "Nan kòmansman lèt li a, Yaʿaqob ap ankouraje tal'midim yo pou yo kenbe fèm lè yo rankontre divès kalite eprèv. Li montre eprèv yo kapab ede yon moun devlope andirans ak matirite. Men, pou fè fas ak sitiyasyon sa yo yon fason ki fè Yahawah plezi, yon moun bezwen bon konprann.\n\nSe nan kontèks sa a Yaʿaqob di: \"Si youn nan nou manke bon konprann, se pou l kontinye mande 'Èlohim li.\" Bon konprann li pale a pa limite ak konesans oswa entèlijans. Li se kapasite pou konprann volonte Yahawah epi aplike Dabar Li a avèk bon jijman nan sitiyasyon lavi yo.\n\nYaʿaqob mete aksan sou jenewozite Yahawah. Li pa dekouraje moun ki pwoche bò kote Li avèk senserite; okontrè, Li dispoze bay direksyon ak bon konprann san Li pa fè repwòch moun ki mande avèk yon kè sensè.\n\nPou Les Membres de La Voie yo, pasaj sa a raple yo pa gen okenn wont pou rekonèt limit pa yo epi chèche direksyon Yahawah. Chak jou pote desizyon, defi ak eprèv ki mande plis pase eksperyans lèzòm; yo mande bon konprann ki soti nan Yahawah.\n\nLè yon tal'mid ap fè fas ak yon chwa enpòtan, yon pwoblèm fanmi, yon desizyon nan qehilah a oswa yon eprèv pèsonèl, li pa dwe konte sèlman sou pwòp refleksyon pa li. Li dwe hitpallél, etidye Ketubim Qadoshim yo epi chèche konprann prensip Yahawah yo pou l ka pran desizyon ki ann amoni ak volonte Li.\n\nPasaj sa a ankouraje Les Membres de La Voie yo tou pou yo gen konfyans nan jenerozite Yahawah. Lè yo mande Li bon konprann avèk émounah ak yon kè ki dispoze obeyi, yo kapab gen asirans Li ap gide yo atravè Dabar Li a epi ede yo mache sou bon chemen an.", "liy_final": "Vrè bon konprann pa soti nan kapasite lèzòm sèlman; li soti nan Yahawah e Li bay li avèk jenerozite bay moun ki chèche Li avèk yon kè sensè."}, {"jour": 6, "soir_debut": "2026-06-21", "soir_fin": "2026-06-22", "ref": "Yeshaʿeyahou 65:13", "texte_kw": "« Se poutèt sa, men sa Yahawah Adôn ki Souvren an di: 'Gade! ʿEbedim mwen yo ap manje, men nou menm n ap grangou. Gade! ʿEbedim mwen yo ap bwè, men nou menm n ap swaf. Gade! ʿEbedim mwen yo ap rejwi, men nou menm n ap wont.' »", "commentaire": "Nan dènye chapit liv Yeshaʿeyahou a, Yahawah fè yon diferans klè ant de kategori moun. Sou yon bò, gen moun ki vire do bay Li, ki suiv pwòp chemen pa yo epi ki meprize volonte Li. Sou lòt bò, gen ʿEbedim Li yo, moun ki chèche sèvi Li avèk fidelite epi ki dispoze koute Dabar Li a.\n\nSe nan kontèks sa a Yahawah anonse yon kontrast frapan: ʿEbedim Li yo ap jwenn manje, bwason ak lajwa, tandiske moun ki rejte Li yo ap fè eksperyans grangou, swaf ak wont. Pawòl sa yo sèvi pou montre benediksyon Yahawah pa depann sèlman de richès materyèl, men sitou de relasyon yon moun genyen avèk Li ak favè Li akòde a.\n\nPou Les Membres de La Voie yo, pasaj sa a se yon ankourajman pou yo kontinye rete fidèl ak Yahawah menm lè yo ap viv nan yon monn ki souvan chwazi yon lòt direksyon. Yahawah pa bliye ʿEbedim Li yo. Li konnen bezwen yo epi Li pran swen yo selon volonte Li.\n\nPasaj la ankouraje tal'midim Yahushuʿah yo pou yo chèche an premye sa ki gen valè devan Yahawah. Menm lè yo konfwonte difikilte oswa privasyon, yo kapab gen konfyans Yahawah ap soutni yo epi ba yo sa yo bezwen pou kontinye mache sou chemen Li.\n\nAn menm tan, vèsè sa a envite chak moun egzamine pwòp pozisyon li. Èske li ap viv kòm yon ʿEbed Yahawah ki koute Dabar Li a, oswa èske li ap suiv pwòp volonte pa li? Vrè lajwa, vrè satisfaksyon ak vrè espwa jwenn rasin yo nan fidelite anvè Yahawah.", "liy_final": "Yahawah fè yon diferans ant moun ki sèvi Li avèk fidelite ak moun ki vire do bay Li. Se poutèt sa, Les Membres de La Voie yo chwazi mache kòm ʿEbedim Yahawah, avèk konfyans ke Li pap janm abandone moun ki rete atache ak Li."}, {"jour": 7, "soir_debut": "2026-06-22", "soir_fin": "2026-06-23", "ref": "Colossiyim 4:6", "texte_kw": "« Se pou pawòl nou toujou bèl, se pou l asezonnen ak sèl, yon fason pou n konnen jan n dwe reponn chak moun. »", "commentaire": "Nan fen lèt li te voye bay qehilah Coloss la, shilliaḥ Šāʾūl bay plizyè konsèy pratik sou fason pou tal'midim Yahushuʿah yo viv chak jou. Li ankouraje yo pou yo sèvi ak tan yo avèk bon jijman, sitou lè y ap pale ak moun ki pa fè pati qehilah a.\n\nSe nan kontèks sa a li di: \"Se pou pawòl nou toujou bèl, se pou l asezonnen ak sèl.\" Alò, nan tan lontan, sèl te sèvi pou konsève manje epi ba l bon gou. Menm jan an tou, pawòl yon tal'mid pa dwe ni brital ni san valè; pawòl yo dwe itil, ankourajan, reflechi epi adapte ak sitiyasyon chak moun.\n\nObjektif la se pou moun k ap pale a konnen kijan pou l bay yon repons ki montre l gen bon konprann, ki respekte laverite epi ki kapab ede moun k ap koute a.\n\nPou Membres La Voie yo, pasaj sa a raple yo pawòl yo gen anpil enpòtans. Yon tal'mid Yahushuʿah pa sèlman rekonèt apati de aksyon l sèlman, men tou pa fason l pale ak lòt moun. Kit se nan fanmi, nan travay, nan qehilah a oswa sou rezo sosyal yo, pawòl li dwe montre metriz, respè ak bon jijman.\n\n\"Asezonnen ak sèl\" vle di chwazi mo ki bati olye yo kraze, ki klè san yo pa blese initilman, epi ki fidèl ak Dabar Yahawah a. Sa pa vle di evite laverite, men pito prezante l avèk dousè, pasyans ak konsiderasyon pou moun k ap koute a.\n\nPasaj sa a ankouraje Membres La Voie yo tou pou yo adapte repons yo selon moun ak sikonstans yo. Gen moun ki bezwen ankourajman, gen lòt ki bezwen koreksyon, epi gen lòt ankò ki bezwen plis eksplikasyon. Bon jijman pèmèt yon tal'mid konnen ki pawòl ki pi apwopriye nan chak sitiyasyon.", "liy_final": "Pawòl ki soti nan bouch yon tal'mid Yahushuʿah dwe pote gou, limyè ak lavi, pou yo onore Yahawah epi ede lòt moun pwoche pi pre Dabar Li a."}, {"jour": 8, "soir_debut": "2026-06-23", "soir_fin": "2026-06-24", "ref": "1 Shemuʾel 17:45", "texte_kw": "« Ou menm, ou vin sou mwen ak epe, ak frenn ak javlo; men mwen menm, mwen vin sou ou nan Non Yahawah Tseba'oth, 'Èlohim lame Yisra'el yo, Sila ou derespekte a. »", "commentaire": "Pasaj sa a pran plas pandan gwo konfwontasyon ant Dāwīḍ ak Golyath, yon vanyan sòlda filisten ki t ap defye pèp Yisra'el la epi k ap derespekte Non Yahawah. Pandan tout lame Yisra'el la te pè devan gwosè ak fòs Golyath, Dāwīḍ pa t kite aparans oswa zam advèsè l la fè l pè.\n\nLè Golyath vin sou li ak epe, frenn ak javlo, Dāwīḍ reponn li avèk konfyans total nan Yahawah. Li fè konnen viktwa pa depann de fòs fizik oswa zam lagè, men de Yahawah Tseba'oth, Sila ki gen tout pouvwa a e kap defann Non L ak pèp Li. Pawòl Dāwīḍ yo montre batay la pa t sèlman ant de moun; se te yon kesyon fidelite anvè Yahawah ak respè pou Non L.\n\nPou Membres La Voie yo, pasaj sa a raple yo ke pi gwo sous fòs yon tal'mid pa chita nan kapasite pèsonèl li, ni nan resous materyèl li genyen, men nan konfyans li mete nan Yahawah. Nan lavi chak jou, anpil \"Golyath\" kapab parèt sou fòm eprèv, opozisyon, pèsekisyon, maladi oswa lòt defi ki sanble depase fòs nou.\n\nEgzanp Dāwīḍ la ankouraje tal'midim Yahushuʿah yo pou yo pa kite laperèz oswa aparans sitiyasyon yo pran kontwòl sou yo. Lè yo rete fidèl ak Yahawah, yo ka avanse avèk kouraj, paske yo konnen se pa fòs lèzòm kap deside rezilta final la.\n\nPasaj sa a montre n tou enpòtans pou n toujou defann onè Non Yahawah avèk respè e fidélité. Menm lè majorite a dekouraje oswa pè, yon sèl moun ki mete konfyans li nan Yahawah kapab sèvi kòm yon gwo temwayaj pou lòt moun.", "liy_final": "Lè yon tal'mid mete tout konfyans li nan Yahawah olye l konte sou fòs lèzòm, l aprann fè fas ak pi gwo eprèv yo avèk kouraj, paske l konnen Yahawah pap abandone moun ki rete fidèl ak Li."}, {"jour": 9, "soir_debut": "2026-06-24", "soir_fin": "2026-06-25", "ref": "Yeshaʿeyahou 41:10", "texte_kw": "« Ou pa bezwen pè, paske mwen avè w. Pa bay tèt ou pwoblèm, paske mwen se 'Èlohim ou. M ap ba w fòs, wi, m ap ede w. Vrèmanvre, m ap kenbe w byen di ak men dwat mwen pou m mennen w nan chemen ki dwat la. »", "commentaire": "Nan Yeshaʿeyah chapit 41 la, Yahawah ap pale ak pèp Yisra'el la nan yon epòk kote yo t ap fè fas ak gwo menas, ensekirite ak dekourajman. Pandan nasyon ki ozalantou yo te mete konfyans yo nan zidòl ak nan pwòp fòs yo, Yahawah raple pèp Li a se Li menm ki te chwazi l epi ki pa t janm abandone l.\n\nSe nan kontèks sa a Li di: \"Ou pa bezwen pè, paske mwen avè w.\" Pawòl sa yo se yon mesaj rekonfòtan e ankourajan. Yahawah pwomèt prezans Li, soutyen L ak fòs Li pou moun ki mete konfyans yo nan Li. Men dwat Li mansyone a senbolize pouvwa, jistis ak fidelite L pou gide ak soutni ʿEbedim Li yo.\n\nPou Membres La Voie yo, pasaj sa a se yon sous ankourajman nan tout kalite eprèv. Gen moman kote yon tal'mid ka santi l fèb, poukont li oswa enkyete devan difikilte lavi yo. Men Yahawah raple nou prezans Li pa depann de sikonstans yo; Li rete avèk moun kap chèche mache nan chemen L.\n\nPasaj la ankouraje tal'midim Yahushuʿah yo pou yo pa kite laperèz dirije desizyon yo. Olye de sa, yo dwe chèche fòs nan Yahawah atravè téfilah, etid Dabar Li a ak fidélité chak jou. Lè yon moun konte sou Yahawah, lap jwenn kouraj pou l kontinye menm lè chemen an difisil.\n\nAnplis de sa, pwomès Yahawah pou \"kenbe nou byen di ak men dwat Li\" raple nou Li pa sèlman bay enstriksyon; Li soutni, Li gide epi ede moun ki rete fidèl avè L. Sa envite Membres La Voie yo pou yo mete tout konfyans yo nan Li olye pou yo ta konte sèlman sou kapasite pa yo oswa sou èd lèzòm.", "liy_final": "Lè yon tal'mid ap mache avèk Yahawah, li pa bezwen kite laperèz domine l, paske Yahawah pwomèt Li l ap ba l fòs, l ap ede l epi kenbe l fèm sou chemen ki dwat la."}, {"jour": 10, "soir_debut": "2026-06-25", "soir_fin": "2026-06-26", "ref": "Malʾakhi 3:18", "texte_kw": "« Yon lòt fwa ankò, n ap wè diferans ant yon moun ki jis ak yon moun ki mechan, ant yon moun k ap sèvi 'Èlohim ak yon moun ki pap sèvi l. »", "commentaire": "Nan dènye chapit liv Malʾakhi a, Yahawah reponn ak pawòl kèk moun ki t ap di l, sa pa vo anyen pou yo sèvi L, paske yo te wè moun k ap fè sa k mal yo sanble ap reyisi pandan moun ki rete fidèl yo pa jwenn okenn avantaj. Anfas panse sa yo, Yahawah fè konnen L wè tout bagay e Li pa bliye moun ki gen krentif pou Non L.\n\nSe nan kontèks sa a Li pwomèt gen yon lè k ap rive kote diferans lan ap parèt aklè. Moun ki mache nan jistis ak moun ki chwazi mechanste pap resevwa menm rezilta. Menm jan an tou, moun k ap sèvi Yahawah fidèlman ak moun ki refize sèvi L pap gen menm avni. Jijman Yahawah ap revele sa ki te pafwa kache nan je lèzòm.\n\nPou Membres La Voie yo, pasaj sa a se yon envitasyon pou yo pa kite aparans twonpe yo. Nan monn jodi a, li ka sanble pafwa moun ki pap suiv chemen Yahawah a ap viv san pwoblèm oswa ap reyisi plis. Men Malʾakhi raple nou Yahawah pa jije selon aparans; Li konnen kè chak moun epi L fè diferans ant fidelite ak ipokrizi.\n\nTal'midim Yahushuʿah yo pa dwe sèvi Yahawah sèlman pou benefis materyèl oswa pou yo jwenn lwanj nan men moun. Yo sèvi L paske yo renmen L, yo mete émounah yo nan Li epi yo rekonèt chemen L se chemen lavi.\n\nPasaj sa a ankouraje chak manm La Voie pou l egzamine pwòp lavi l. Kesyon ki pi enpòtan an se pa sa lòt moun panse de nou, men si Yahawah rekonèt nou kòm moun k ap sèvi L avèk yon kè sensè. Lè jou a va rive kote L ap fè diferans lan parèt aklè, se fidelite, obeyisans ak andirans ki pral konte.", "liy_final": "Yahawah pa janm konfonn moun k ap sèvi L ak moun ki vire do ba Li. Menm si diferans lan pa toujou parèt jodi a, lè lè a va rive, Li menm ap fè l parèt aklè devan tout moun."}, {"jour": 11, "soir_debut": "2026-06-26", "soir_fin": "2026-06-27", "ref": "Éphésiyim 6:4", "texte_kw": "« E nou menm papa, pa nwi pitit nou jiskaske pou n ta fè yo fache, men kontinye leve yo nan disiplin Yahawah ak nan avètisman Li bay. »", "commentaire": "Nan Éphésiens chapit 6 la, shilliaḥ Šāʾūl bay enstriksyon sou relasyon ki dwe egziste anndan fanmi an. Apre l fin pale sou devwa timoun yo anvè paran yo, li vire bò kot papa yo epi l ba yo yon responsablite enpòtan. Li avèti yo pou yo pa trete pitit yo yon fason ki ka dekouraje yo, ki ka fè yo pèdi kouraj oswa ki ka pwovoke yo san rezon.\n\nOkontrè, Šāʾūl ankouraje yo pou yo leve pitit yo nan disiplin Yahawah ak nan avètisman ki soti nan Dabar Li a. Objektif disiplin sa a se pa kraze pitit la, men ede l grandi avèk bon prensip, bon jijman ak respè pou Yahawah.\n\nPou Membres La Voie yo, pasaj sa a montre paran yo resevwa yon misyon sakre. Leve yon timoun pa sèlman vle di bay manje, rad oswa edikasyon; sa mande tou pou fòme karaktè li selon prensip Yahawah.\n\nPapa ak manman yo dwe evite move kòlè, enjistis, imilyasyon oswa egzije plis pase sa yon timoun kapab pote. Disiplin ki soti nan Yahawah chèche korije avèk lanmou, pasyans ak regilarite, pou pitit la aprann fè sa ki dwat par konviksyon olye de laperèz.\n\nPasaj la ankouraje tout fanmi ki nan La Voie pou yo fè lakay yo tounen yon kote, yo li Dabar Yahawah a, etidye l epi mete l an pratik. Lè paran yo bay bon egzanp nan pawòl ak nan konduit yo, yo ede pitit yo devlope yon émounah solid epi prepare yo pou rete fidèl devan eprèv lavi yo.", "liy_final": "Disiplin ki baze sou Dabar Yahawah a pa kraze yon timoun; li fòme l, pwoteje l epi prepare l pou l mache avèk fidelite sou chemen Yahawah pandan tout lavi li.", "yom": "Shabbath", "verset": "Éphésiyim 6:4"}, {"jour": 12, "yom": "Yôm Rishon", "soir_debut": "2026-06-27", "soir_fin": "2026-06-28", "ref": "Maʿasei 20:35", "texte_kw": "« Mwen te montre nou nan tout bagay se pou nou travay di menm jan an pou nou ede moun ki fèb yo, e nou dwe sonje pawòl Adôn Yaḥushuʿah yo, li menm ki te di: 'Gen plis kè kontan lè yon moun bay pase lè l resevwa.' »", "commentaire": "Pawòl sa yo fè pati dènye diskou shilliaḥ Šāʾūl te bay ziqnei qehilah Éphèse la anvan l te kite yo. Li te raple yo fason l te viv pandan tout tan l te pase avèk yo. Li pa t chèche richès oswa avantaj pèsonèl; okontrè, li te travay di pou l pran swen pwòp bezwen pa l ak bezwen moun ki te avè l.\n\nSe nan kontèks sa a Šāʾūl ankouraje ziqnei yo pou yo pran swen moun ki fèb yo epi suiv egzanp Yahushuʿah. Li raple yo yon pawòl Yahushuʿah te di ki pa parèt nan lòt resi yo: \"Gen plis kè kontan lè yon moun bay pase lè l resevwa.\" Avèk pawòl sa yo, li montre vrè lajwa pa chita nan sa yon moun akimile pou tèt li, men nan sa l pataje pou byen lòt moun.\n\nPou Membres La Voie yo, pasaj sa a raple yo qehilah Yahawah a bati sou lespri sèvis ak jenewozite. Chak tal'mid Yahushuʿah resevwa kapasite, tan, konesans oswa byen l kapab itilize pou soulaje fado lòt moun.\n\nEde moun ki fèb yo pa limite ak èd materyèl sèlman. Sa gen ladan l ankouraje moun ki dekouraje, soutni moun ki anba eprèv, vizite moun ki poukont yo, pataje Dabar Yahawah a ak moun ki bezwen l, epi dispoze sèvi san chèche lwanj oswa rekonpans.\n\nPasaj sa a ankouraje Membres La Voie yo pou yo devlope yon lespri ki toujou pare pou bay. Lè yon qehilah pratike lanmou sa a, inite li vin pi solid, e chak manm santi l gen plas li ladan l. Se konsa tal'midim Yahushuʿah yo fè pawòl Mèt yo tounen yon reyalite nan lavi yo chak jou.", "liy_final": "Vrè richès yon tal'mid pa mezire selon sa l resevwa, men selon lanmou, tan ak sa l dispoze pataje pou byen lòt moun, jan Yahushuʿah te montre sa grasa egzanp li."}, {"jour": 13, "yom": "Yôm Sheni", "soir_debut": "2026-06-28", "soir_fin": "2026-06-29", "ref": "Philippiyim 3:16", "texte_kw": "« Antouka, kèlkeswa degre nou rive nan pwogrè nou, annou kontinye mache annòd nan menm direksyon an. »", "commentaire": "Nan Philippiens chapit 3 a, shilliaḥ Šāʾūl t ap ankouraje tal'midim yo pou yo pa panse yo deja rive nan objektif final la. Li menm, malgre tout eksperyans li te genyen nan sèvis Yahawah a, li fè konnen l te kontinye fè efò pou l avanse, li bliye sa ki dèyè epi l lonje kò l nan direksyon sa ki devan.\n\nSe nan kontèks sa a l te di: \"Kèlkeswa degre nou rive nan pwogrè nou, annou kontinye mache annòd nan menm direksyon an.\" Pawòl sa yo montre chak tal'mid ka rive nan yon nivo diferan nan kwasans roḥanit li. Men, kèlkeswa nivo sa a, tout moun dwe kontinye pwogrese ansanm, san yo pa vire do bay prensip Yahawah yo oswa kite chemen yo te deja aprann lan.\n\nPou Membres La Voie yo, pasaj sa a raple yo lavi yon tal'mid se yon chemen kwasans kontinyèl. Pa gen plas pou satisfè tèt nou tankou si nou deja rive nan tout sa Yahawah vle pou nou. Chak jou se yon nouvo okazyon pou n grandi nan émounah, nan konpreyansyon Dabar Yahawah a ak nan bon konduit.\n\nPasaj la ankouraje qehilah a tou pou l konsève inite l. Menm si chak moun ap pwogrese nan rit pa l, tout tal'midim Yahushuʿah yo dwe kontinye mache nan menm direksyon an, sa vle di rete fidèl ak ansèyman Yahushuʿah yo e prensip Ketoubim Qadoshim yo. Pwogrè pa dwe mennen nan divizyon, men nan yon pi gwo inite ki baze sou laverite.\n\nAnplis, pawòl Šāʾūl yo envite chak moun egzamine tèt li avèk imilite. Olye pou yon tal'mid konpare tèt li ak yon lòt, li ta dwe mande tèt li si l kontinye avanse chak jou sou chemen Yahawah a. Se fidelite nan pwogrè sa a ki fè yon moun vin pi solid nan sèvis li.", "liy_final": "Yon tal'mid Yahushuʿah pa janm sispann grandi. Kèlkeswa nivo l rive, li dwe kontinye mache annòd, avèk imilite, fidelite, nan menm direksyon Yahawah trase pou pèp Li a."}, {"jour": 14, "yom": "Yôm Shlishi", "soir_debut": "2026-06-29", "soir_fin": "2026-06-30", "ref": "Ibriyim 6:10", "texte_kw": "« 'Èlohim pa enjis pou l ta bliye travay nou fè ak lanmou nou demontre pou Non Li lè nou ede moun ki qadosh yo e nou kontinye ap ede yo. »", "commentaire": "Nan Ibriyim chapit 6 la, otè a ankouraje tal'midim yo pou yo pa rete nan ansèyman debaz yo sèlman, men pou yo kontinye grandi nan matirite roḥanit. Li konnen kèk ladan yo t ap travèse eprèv ak dekourajman, e te gen risk pou yo lage fèmte yo.\n\nSe nan kontèks sa a li te raple yo Yahawah pa tankou lèzòm ki ka bliye byen yon moun fè. Li wè tout efò tal'midim Yaḥushuʿah yo, tout sèvis yo rann ak tout lanmou yo montre pou Non L. Lanmou sa a pa t rete nan pawòl sèlman; li te parèt nan fason yo te pran swen moun ki qadosh yo e yo te kontinye fè sa avèk fidelite.\n\nPawòl sa yo se yon ankourajman pou moun ki te ka panse sèvis yo t ap pase inapèsi. Yahawah remake chak aksyon ki fèt avèk yon kè sensè pou onore Non L.\n\nPou Membres La Voie yo, pasaj sa a raple yo pa gen okenn sèvis ki fèt pou Yahawah kap pèdi. Kit se ede yon akh oswa yon akhot ki nan bezwen, ankouraje yon moun ki dekouraje, patisipe nan travay qehilah a, oswa itilize tan ak kapasite yo pou avansman Dabar Yahawah a, Yahawah wè tout bagay.\n\nPasaj la ankouraje tal'midim Yahushuʿah yo pou yo kontinye fè byen san yo pa tann rekonesans nan men lèzòm. Gen defwa efò yon moun pa remake oswa yo pa di l \"mèsi\", men Yahawah pa bliye okenn zak lanmou ki fèt pou Non L.\n\nAn menm tan, pasaj sa a montre vrè lanmou pou Yahawah toujou parèt nan fason nou trete lòt moun, sitou moun ki fè pati qehilah Li a. Yon tal'mid ki renmen Yahawah ap chèche okazyon pou sèvi, soutni ak ankouraje lòt moun avèk yon kè ki pap chèche avantaj pèsonèl.", "liy_final": "Yahawah pa janm bliye okenn zak lanmou ni okenn sèvis ki fèt pou Non L. Chak efò yon tal'mid fè avèk yon kè sensè gen anpil valè nan je Yahawah, menm lè pèsonn pa remake l."}, {"jour": 15, "yom": "Yôm Rebi'i", "soir_debut": "2026-06-30", "soir_fin": "2026-07-01", "ref": "Tehillim 37:25", "texte_kw": "« Mwen te jèn yon lè, e kounye a mwen vin granmoun, men mwen pa janm wè 'Èlohim abandone yon moun ki jis, ni mwen pa janm wè pitit li ap mande lacharite. »", "commentaire": "Tehillim 37 la se yon chante Dāwīḍ kote l t ap ankouraje moun k ap sèvi Yahawah yo pou yo pa dekouraje lè yo wè moun mechan yo sanble ap mennen. Pandan tout chante a, li montre richès ak siksè mechan yo pap dire, tandiske moun ki rete fidèl ak Yahawah gen yon espwa ki solid.\n\nLè Dāwīḍ di: \"Mwen te jèn yon lè, e kounye a mwen vin granmoun,\" li pa t ap pale sou yon ide oswa yon teyori. Li t ap pale sou sa l te obsève pandan tout lavi l. Avèk eksperyans li, li temwaye li pa janm wè Yahawah abandone yon moun ki jis. Sa pa vle di moun ki jis yo pa janm pase anba eprèv oswa mank, men sa vle di Yahawah pap janm sispann pran swen yo ni kite yo san soutyen.\n\nPawòl sa yo montre fidelite Yahawah dire tout lavi. Li pa bliye moun ki mete konfyans yo nan Li epi ki kontinye mache nan chemen L.\n\nPou Membres La Voie yo, pasaj sa a se yon sous gwo ankourajman. Gen moman kote lavi a ka pote difikilte ekonomik, maladi, opozisyon oswa lòt eprèv ki ka fè yon moun mande si Yahawah wè sitiyasyon l. Temwayaj Dāwīḍ la raple nou Yahawah toujou fidèl ak moun ki rete atache ak Li.\n\nSa ankouraje tal'midim Yahushuʿah yo pou yo pa pran desizyon ki kont Dabar Yahawah a sèlman paske yo anba presyon oswa nan bezwen. Yo kapab kontinye mete konfyans yo nan Yahawah, paske L konnen bezwen ʿEbedim Li yo epi L kapab sèvi ak plizyè mwayen pou soutni yo nan moman ki apwopriye a.\n\nPasaj sa a raple Membres La Voie yo tou enpòtans pou yo pran swen youn lòt. Yahawah souvan sèvi ak qehilah Li a pou pote sekou, ankourajman ak sipò bay moun ki nan bezwen. Lè nou ede youn lòt avèk lanmou, nou patisipe nan swen Yahawah montre pou pèp Li a.", "liy_final": "Eksperyans Dāwīḍ la montre fidelite Yahawah pa chanje. Moun ki rete fidèl ak Li kapab travèse anpil eprèv, men Yahawah pap janm abandone yo ni sispann pran swen yo."}, {"jour": 16, "yom": "Yôm Hamishi", "soir_debut": "2026-07-01", "soir_fin": "2026-07-02", "ref": "1 Corinthiyim 8:4", "texte_kw": "« Kounye a, pou kesyon manje yo ofri bay zidòl, nou konnen yon zidòl pa anyen ditou, e nou konnen se yon sèl 'Èlohim ki genyen. »", "commentaire": "Nan 1 Corinthiens chapit 8 la, shilliaḥ Šāʾūl reponn yon kesyon qehilah Corinthe lan te poze konsènan manje ki te ofri bay zidòl. Nan vil Corinthe, anpil bèt yo te vann sou mache oswa yo te sèvi nan resepsyon te deja pase nan tanp zidòl yo. Sa te kreye kesyon lakay kèk tal'mid sou si yo te ka manje vyann sa yo oswa non.\n\nŠāʾūl fè konnen yon zidòl pa gen okenn pouvwa ni okenn egzistans reyèl. Li raple qehilah a gen yon sèl vrè 'Èlohim. Men, li pa limite repons li an ak konesans sa a sèlman. Nan rès chapit la, li montre lanmou pou lòt moun pi enpòtan pase dwa pèsonèl yon moun. Si yon aksyon riske boulvèse konsyans yon lòt tal'mid oswa fè l bite, pi bon chwa a se renonse ak libète sa a pou pwoteje lòt moun.\n\nPou Membres La Voie yo, pasaj sa a montre vrè konesans toujou mache ansanm ak lanmou. Yon tal'mid Yahushuʿah pa dwe sèlman mande si yon bagay pèmèt; li dwe mande tou ki efè aksyon l pral genyen sou lòt moun ak sou qehilah a.\n\nPasaj la raple nou tou pa gen okenn lòt otorite oswa okenn lòt objè adorasyon ki ka pran plas Yahawah. Tout fòm idolatri, kit li vizib oswa kache, pa gen okenn valè devan L. Se Yahawah sèlman ki merite adorasyon, respè ak fidelite total.\n\nAn menm tan, Membres La Voie yo ankouraje pou yo sèvi ak bon jijman nan desizyon yo. Menm lè yon moun konnen yon bagay pa gen okenn pouvwa sou li, li dwe toujou aji avèk konsiderasyon pou konsyans lòt tal'midim yo. Konsa, inite, lanmou ak lapè anndan qehilah a ap kontinye grandi.", "liy_final": "Vrè émounah a pa montre sèlman nan sa yon tal'mid konnen; li parèt sitou nan lanmou, konsiderasyon ak respè l demontre pou Yahawah ak pou lòt moun."}, {"jour": 17, "yom": "Ereb Shabbath", "soir_debut": "2026-07-02", "soir_fin": "2026-07-03", "ref": "Yirmeyah 17:10", "texte_kw": "« Mwen menm, Yahawah, mwen egzamine kè a, mwen egzamine panse ki pi pwofon yo, pou m bay chak moun sa yo merite selon aksyon yo, selon fason yo aji. »", "commentaire": "Nan Yirmeyah chapit 17 la, Nabi Yirmeyah montre diferans ki genyen ant moun ki mete konfyans yo nan lèzòm ak moun ki mete konfyans yo nan Yahawah. Li fè konnen kè lèzòm kapab twonpe yo, paske l konplike e l pa toujou revele vrè entansyon yon moun.\n\nSe nan kontèks sa a Yahawah deklare se Li menm ki egzamine kè a ak panse ki pi pwofon yo. Kontrèman ak lèzòm ki wè sèlman aparans, Yahawah wè sa ki kache nan fon kè yon moun. Li konnen vrè motivasyon ki dèyè chak pawòl, chak desizyon ak chak aksyon. Se poutèt sa jijman L toujou jis, paske L baze sou laverite, pa sou aparans.\n\nPawòl sa yo raple nou pèsonn pa kapab twonpe Yahawah. Li konnen sa yon moun ye toutbon, menm lè lòt moun pa wè sa.\n\nPou Membres La Voie yo, pasaj sa a envite chak tal'mid Yahushuʿah pou l egzamine pwòp motivasyon l. Li pa sifi pou yon moun parèt fidèl devan lòt moun; sa ki pi enpòtan an se sa Yahawah wè nan kè l.\n\nLè nou patisipe nan aktivite qehilah a, lè n ap ede lòt moun oswa lè n pran yon responsablite, nou dwe fè sa pou onore Yahawah, pa pou chèche lwanj oswa rekonesans nan men lèzòm. Yahawah wè menm aksyon moun pa remake yo, epi L konnen lè yon sèvis fèt avèk yon kè ki sensè.\n\nPasaj sa a ankouraje Membres La Voie yo tou pou yo pa dekouraje lè moun mal jije oswa mal konprann yo. Lèzòm kapab fè erè nan jijman yo, men Yahawah toujou konnen laverite. Se poutèt sa yon tal'mid dwe kontinye mache avèk entegrite, paske l konnen se devan Yahawah l pral rann kont.", "liy_final": "Yahawah pa gade sou aparans; Li egzamine kè a. Se poutèt sa, yon tal'mid Yahushuʿah dwe chèche gen yon kè ki pwòp ak yon motivasyon ki sensè devan Yahawah nan tout sa l ap fè."}, {"jour": 18, "yom": "Shabbath", "soir_debut": "2026-07-03", "soir_fin": "2026-07-04", "ref": "Yeshaʿeyahou 41:13", "texte_kw": "« Paske, mwen menm, Yahawah, 'Èlohim ou an, mwen kenbe men dwat ou, e mwen se Sila a k ap di w: 'Ou pa bezwen pè, m ap ede w.' »", "commentaire": "Nan Yeshaʿeyahou chapit 41 la, Yahawah ap pale ak pèp Yisra'el la nan yon epòk kote yo te antoure ak gwo menas ak anpil rezon pou yo pè. Pandan lòt nasyon yo t ap konte sou fòs militè yo, sou alyans politik yo oswa sou zidòl yo, Yahawah raple pèp Li a se Li menm ki te chwazi yo, ki rele yo epi ki pa t abandone yo.\n\nApre Li fin di: \"Ou pa bezwen pè, paske mwen avè w\" (vèsè 10), Yahawah kontinye ak yon bèl imaj nan vèsè 13 la. Li prezante tèt Li tankou yon papa ki kenbe men pitit li pou ede l travèse yon chemen ki difisil. Pawòl sa yo pa sèlman anonse pwoteksyon Yahawah; yo montre prezans Li, konpasyon L ak angajman L pou soutni ʿEbedim Li yo nan tout eprèv yo.\n\nPou Membres La Voie yo, pasaj sa a se yon sous rekonfò lè yo ap travèse moman ensekirite, soufrans oswa dekourajman. Gen sitiyasyon ki ka sanble twò lou pou fòs lèzòm, men Yahawah raple tal'midim Yahushuʿah yo yo pa poukont yo. Li kenbe men moun ki mete konfyans yo nan Li epi L mache avèk yo.\n\nPasaj sa a ankouraje chak tal'mid pou l pa kite laperèz dirije lavi l. Lè difikilte yo pran pye, premye reyaksyon an pa dwe dezespwa, men konfyans nan pwomès Yahawah yo. Li pa pwomèt yon lavi san eprèv, men Li pwomèt prezans Li ak èd Li pandan eprèv yo.\n\nAn menm tan, Membres La Voie yo kapab imite Yahawah lè yo lonje men bay moun ki fèb, moun ki dekouraje oswa moun ki anba chay. Lè nou soutni youn lòt avèk lanmou, nou vin reflete swen Yahawah montre pou pèp Li a.", "liy_final": "Lè Yahawah kenbe men yon tal'mid, pa gen okenn eprèv ki twò gwo pou l fè fas avè l, paske fòs li pa soti nan tèt li, men nan Yahawah ki toujou di: 'Ou pa bezwen pè, m ap ede w.'"}, {"jour": 19, "yom": "Yôm Rishon", "soir_debut": "2026-07-04", "soir_fin": "2026-07-05", "ref": "Melakhim I 1:39", "texte_kw": "« Epi, Tsadoq, kohen lan, pran kòn luil la nan tant lan e li vide enpe luil sou tèt Shlomo. Apre sa, yo kòmanse sonnen kòn nan e tout pèp la t ap di byen fò: 'Se pou mel'ekh Shlomo viv lontan!' »", "commentaire": "Pasaj sa a pran plas nan fen rèy Dāwīḍ la. Pandan l te fin granmoun anpil, Adoniyah t ap eseye pran twòn nan san otorizasyon Yahawah ni san desizyon Dāwīḍ. Men, Dāwīḍ te deja fè konnen se Shlomo Yahawah te chwazi pou vin mel'ekh apre l.\n\nPou montre chwa sa a devan tout pèp la, Dāwīḍ bay Tsadoq, kohen lan, ansanm ak Nathān, Nabi a, lòd pou yo vide luil sou tèt Shlomo nan Gihôn. Lwil la pa t bay Shlomo otorite pa li menm; li te sèvi kòm siy vizib ki montre Yahawah te mete l apa pou responsablite sa a. Son kòn lan ak aklamasyon pèp la te konfime piblikman chwa Yahawah a epi yo te mete fen nan tantativ Adoniyah a pou pran pouvwa a.\n\nPou Membres La Voie yo, pasaj sa a raple nou Yahawah se Sila a ki etabli responsablite selon volonte L. Lèzòm ka gen anbisyon oswa chèche pran plas ki pa pou yo, men se Yahawah ki gen dènye pawòl la.\n\nEgzanp Shlomo a ankouraje tal'midim Yahushuʿah yo pou yo aprann tann direksyon Yahawah olye yo chèche monte tèt yo oswa chèche onè pou tèt yo. Lè Yahawah konfye yon sèvis oswa yon responsablite, L atann moun nan sèvi avèk imilite, fidelite ak respè pou Dabar Li a.\n\nPasaj sa a raple Membres La Voie yo tou ke tout sèvis nan qehilah a dwe fèt selon lòd Yahawah, pa selon anbisyon pèsonèl. Lè chak moun aksepte plas Yahawah ba li epi l sèvi avèk yon kè sensè, sa pote inite, estabilite ak benediksyon nan mitan pèp Li a.", "liy_final": "Yahawah se Sila a ki etabli moun pou sèvis Li. Lè yon tal'mid tann direksyon Yahawah epi l sèvi avèk imilite, li montre l mete konfyans li nan chwa Yahawah olye l konte sou anbisyon lèzòm."}, {"jour": 20, "yom": "Yôm Shéni", "soir_debut": "2026-07-05", "soir_fin": "2026-07-06", "ref": "Galatiyim 6:9", "texte_kw": "« Donk, annou pa sispann fè sa ki byen, paske lè lè a rive, n ap rekòlte si nou pa kite fatig pote n ale. »", "commentaire": "Nan dènye pati lèt li te voye bay Galatiyim yo, shilliaḥ Šāʾūl ankouraje tal'midim yo pou yo viv ann amoni ak direksyon Rouaḥ Yahawah a. Li montre lavi yon moun sanble ak yon jaden: sa yon moun simen, se sa l ap rekòlte. Moun ki simen selon volonte Yahawah ap rekòlte lavi, tandiske moun ki suiv dezi chè a ap rekòlte move konsekans.\n\nSe nan kontèks sa a Šāʾūl di: \"Annou pa sispann fè sa ki byen.\" Li te konnen fè sa ki dwat mande andirans. Gen moman kote yon tal'mid ka santi l dekouraje paske rezilta efò l yo pa parèt tousuit. Men Šāʾūl raple yo Yahawah fikse yon tan pou rekòt la. Si yo kontinye rete fidèl san yo pa lage, yo pap pèdi rekonpans Yahawah prepare pou yo a.\n\nPou Membres La Voie yo, pasaj sa a se yon gwo ankourajman pou yo kontinye fè sa ki byen menm lè yo pa wè rezilta yo imedyatman. Travay pou Yahawah, ede lòt moun, anonse Dabar Li a, soutni qehilah a oswa rete fidèl anba eprèv kapab mande anpil pasyans ak andirans. Men Yahawah wè tout efò sa yo.\n\nPasaj la raple tal'midim Yahushuʿah yo pou yo pa kite fatig, desepsyon oswa opozisyon fè yo abandone sa ki dwat. Souvan, rekòt Yahawah pwomèt la pa vini nan moman n te espere a, men Li pa janm bliye travay moun ki rete fidèl yo.\n\nLi ankouraje Membres La Voie yo tou pou yo kontinye fè byen san yo pa chèche rekonpans nan men lèzòm. Lè yon tal'mid fè sa ki byen paske l renmen Yahawah, li ka gen asirans Yahawah ap rekonèt fidelite l nan tan L fikse a.", "liy_final": "Yon tal'mid Yahushuʿah pa mezire fidelite l selon rezilta li wè tousuit. Li kontinye fè sa ki byen avèk pasyans, paske l gen konfyans Yahawah ap fè rekòt la rive nan moman L chwazi a."}, {"jour": 21, "yom": "Yôm Shlishi", "soir_debut": "2026-07-06", "soir_fin": "2026-07-07", "ref": "Éphésiyim 5:1", "texte_kw": "« Kidonk, se pou nou imite 'Èlohim, antanke pitit Li renmen. »", "commentaire": "Nan Éphésiyim chapit 4 la ak kòmansman chapit 5 lan, shilliaḥ Šāʾūl ankouraje tal'midim yo pou yo abandone ansyen fason yo te konn viv la epi adopte yon nouvo konduit ki ann amoni ak volonte Yahawah. Li pale sou nesesite pou mete lwen manti, move kòlè, mechanste, rayisman ak tout konduit ki pa fè Yahawah plezi. Olye de sa, li ankouraje yo pou yo montre konpasyon, padon ak lanmou youn pou lòt.\n\nSe apre tout konsèy sa yo li di: \"Kidonk, se pou nou imite 'Èlohim, antanke pitit Li renmen.\" Pawòl sa yo montre objektif yon tal'mid se pa sèlman konnen Dabar Yahawah a, men reflete kalite Yahawah yo nan lavi yo chak jou. Menm jan yon timoun souvan imite papa l, tal'midim Yahushuʿah yo dwe chèche imite karaktè Yahawah.\n\nPou Membres La Voie yo, pasaj sa a se yon envitasyon pou yo fè chak desizyon ak chak aksyon yo reflete fason Yahawah aji. Lè nou montre lanmou, mizèrikòd, pasyans, jistis ak fidelite, nou montre nou se pitit Yahawah renmen.\n\nImite Yahawah mande plis pase pale de Li; sa mande pou n kite Dabar Li a transfòme fason n panse, fason n pale ak fason n trete lòt moun. Se sitou nan moman ki difisil yo, lè nou dwe padone, montre pasyans oswa fè sa ki dwat malgre presyon, nou demontre si nou vrèman ap imite Yahawah.\n\nPasaj sa a ankouraje Membres La Voie yo pou yo toujou mande tèt yo: \"Ki jan Yahawah ta vle mwen reyaji nan sitiyasyon sa a?\" Lè yon tal'mid pran abitid reflechi konsa, li kontinye grandi nan matirite roḥanit epi l vin yon pi bon temwayaj pou moun ki bò kote l.", "liy_final": "Imite Yahawah se pi gwo prèv yon tal'mid bay ke l renmen L. Se pa sèlman nan pawòl, men nan karaktè, nan konduit ak nan lanmou li demontre chak jou."}, {"jour": 22, "yom": "Yôm Rebi'i", "soir_debut": "2026-07-07", "soir_fin": "2026-07-08", "ref": "1 Timotheos 3:13", "texte_kw": "« Moun ki sèvi byen yo vin gen yon bon repitasyon epi yo jwenn yon gwo asirans pou pale avèk franchiz, grasa émounah yo nan Mashiaḥ Yahushuʿah. »", "commentaire": "Nan 1 Timotheos chapit 3 a, shilliaḥ Šāʾūl bay Timotheos enstriksyon sou kalite moun ki dwe resevwa responsablite nan qehilah a. Li pale sou kondisyon pou paqidim ak moun k ap sèvi nan divès responsablite. Li montre sèvis sa yo pa ta dwe baze sou prestij oswa pozisyon, men sou bon konduit, fidelite ak matirite roḥanit.\n\nSe nan kontèks sa a li fè konnen moun ki sèvi byen yo jwenn de gwo byenfè. Premyèman, yo bati yon bon repitasyon devan Yahawah ak devan qehilah a. Dezyèmman, sèvis fidèl yo ranfòse émounah yo nan Mashiaḥ Yahushuʿah, sa ki fè yo vin pale avèk plis franchiz, plis konviksyon ak plis kouraj lè y ap anonse Dabar Yahawah a. Šāʾūl montre sèvis fidèl la pa sèlman itil pou lòt moun; li fòme karaktè moun k ap sèvi a tou.\n\nPou Membres La Voie yo, pasaj sa a raple yo pa gen okenn sèvis ki twò piti lè li fèt pou Yahawah. Kit yon tal'mid resevwa yon gwo responsablite oswa yon sèvis ki pa twò vizib, fidelite li nan sa l ap fè a gen anpil valè devan Yahawah.\n\nLè yon moun sèvi avèk imilite, lanmou ak regilarite, li pa sèlman ede qehilah a; li menm tou li grandi nan émounah. Avèk le tan, eksperyans sa a ap ba l plis konfyans pou l pale sou Dabar Yahawah a epi ankouraje lòt moun avèk franchiz.\n\nPasaj sa a ankouraje Membres La Voie yo pou yo pa chèche pozisyon oswa lwanj, men pou yo chèche sèvi byen. Yon bon repitasyon pa bati ak pawòl sèlman; li bati chak jou atravè entegrite, fidelite ak lespri sèvis.", "liy_final": "Yon tal'mid k ap sèvi Yahawah avèk fidelite pa sèlman vin itil pou qehilah a; li grandi tou nan émounah, li bati yon bon repitasyon epi l jwenn plis kouraj pou fè konnen Dabar Yahawah a avèk franchiz e konviksyon."}]}];
</script>
<script>
// Map ilustrasyon pa jou Rebi'i
const ILLUSTRASYON = {
  "Rebi'i": {
    4: 'illus-rebi-4.jpg',
    5: 'illus-rebi-5.png',
    6: 'illus-rebi-6.png',
    7: 'illus-rebi-7.png',
    8: 'illus-rebi-8.png',
    9: 'illus-rebi-9.png',
    10: 'illus-rebi-10.jpg',
    11: 'illus-rebi-11.png',
    12: 'illus-rebi-12.png',
    13: 'illus-rebi-13.png',
    14: 'illus-rebi-14.png',
    15: 'illus-rebi-15.png',
    16: 'illus-rebi-16.jpg',
    17: 'illus-rebi-17.png',
    18: 'illus-rebi-18.png',
    19: 'illus-rebi-19.jpg',
    20: 'illus-rebi-20.jpg',
    21: 'illus-rebi-21.png',
    22: 'illus-rebi-22.jpg'
  }
};
const VWA = {
  "Rebi'i": {
    5: 'vwa-rebi-5.ogg',
    6: 'vwa-rebi-6.mp3',
    7: 'vwa-rebi-7.mp3',
    8: 'vwa-rebi-8.ogg',
    9: 'vwa-rebi-9.ogg',
    10: 'vwa-rebi-10.ogg',
    11: 'vwa-rebi-11.mp3',
    12: 'vwa-rebi-12.mp3',
    13: 'vwa-rebi-13.mp3',
    14: 'vwa-rebi-14.mp3',
    15: 'vwa-rebi-15.mp3',
    16: 'vwa-rebi-16.mp3',
    17: 'vwa-rebi-17.mp3',
    18: 'vwa-rebi-18.mp3',
    19: 'vwa-rebi-19.mp3',
    20: 'vwa-rebi-20.mp3',
    21: 'vwa-rebi-21.mp3',
    22: 'vwa-rebi-22.mp3'
  }
};

// Etoiles
const scene=document.getElementById('scene');
for(let i=0;i<55;i++){const e=document.createElement('div');e.className='etoile';const sz=Math.random()*2.5+0.8;e.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-duration:${2.5+Math.random()*4}s;animation-delay:${Math.random()*5}s`;scene.appendChild(e);}

// Jwenn jou aktyèl
function jwennJounen(){
  if(typeof TEKS_DATA==='undefined') return null;
  const liste=Array.isArray(TEKS_DATA)?TEKS_DATA:[TEKS_DATA];
  const now=new Date();
  const apSol=now.getHours()*60+now.getMinutes()>=20*60+30;
  const pad=n=>String(n).padStart(2,'0');
  const datGreg=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  for(const mwa of liste){
    for(const j of mwa.jours){
      if(j.soir_debut===datGreg && apSol) return {jounen:j, mois:mwa.mois};
      if(j.soir_fin===datGreg && !apSol)  return {jounen:j, mois:mwa.mois};
    }
  }
  return null;
}

// Nom jou semèn La Voie
const jSem=['Yôm Rishon','Yôm Sheni','Yôm Shlishi',"Yôm Rebi'i",'Yôm Hamishi','Ereb Shabbath','Shabbath'];
// La Voie: dim=Rishon(0), lun=Sheni(1), mar=Shlishi(2), mer=Rebi'i(3), jed=Hamishi(4), ven=Ereb Shabbath(5), sam=Shabbath(6)
// Apre 20:30, jou kalanbdriye a chanje
function jwennNomJou(jounen){
  // Pran nomJou dirèkteman nan done si li egziste
  if(jounen.nomJou) return jounen.nomJou;
  const now=new Date();
  const apSol=now.getHours()*60+now.getMinutes()>=20*60+30;
  // Si apSol, se jou ki kòmanse aswè a (soir_debut)
  // Si pa apSol, se jou ki fini jodi a (soir_fin)
  // Kalkile jou semèn selon soir_debut oswa soir_fin
  const datRef = apSol ? new Date(jounen.soir_debut+'T21:00:00') : new Date(jounen.soir_fin+'T10:00:00');
  const d = datRef.getDay(); // 0=dim...6=sam
  return jSem[d===0?0:d===1?1:d===2?2:d===3?3:d===4?4:d===5?5:6];
}

const resultat=jwennJounen();
let slides=[];
let idxActif=0;

if(resultat){
  const {jounen,mois}=resultat;
  const nomJou=jwennNomJou(jounen);
  const badge=`${nomJou} · ${jounen.jour} ${mois}`;

  // Ilustrasyon si disponib
  const illus = ILLUSTRASYON[mois] && ILLUSTRASYON[mois][jounen.jour];
  if(illus) slides.push({type:'illus',badge,src:illus});

  // Chaje vwa si disponib
  const vwaFichye = VWA[mois] && VWA[mois][jounen.jour];
  if(vwaFichye){
    const av = document.getElementById('audio-vwa');
    av.src = vwaFichye;
    document.getElementById('btn-vwa').style.display = 'flex';
  }

  // Vèsè
  slides.push({type:'verset',badge,texte:jounen.texte_kw||jounen.texte,ref:jounen.ref});

  // Kòmantè
  if(jounen.commentaire){
    jounen.commentaire.split('\n\n').filter(p=>p.trim()).forEach((p,i,arr)=>{
      slides.push({type:'commentaire',badge,texte:p.trim(),num:i+1,total:arr.length});
    });
  }

  // Liy final
  if(jounen.liy_final) slides.push({type:'liy_final',badge,texte:jounen.liy_final});
} else {
  slides.push({type:'verset',badge:'La Voie',texte:'Tèks pou jounen an ap vini...',ref:''});
}

function rendSlide(idx){
  const wrap=document.getElementById('slides-wrap');
  const s=slides[idx];
  let html='';
  if(s.type==='illus'){
    html=`<div class="slide-illus"><img src="${s.src}" alt="Illustration ${s.badge}"/></div>`;
  } else if(s.type==='verset'){
    html=`<div class="badge-jou">${s.badge}</div><div class="sep"></div><div class="verset">${s.texte}</div>${s.ref?`<div class="ref">— ${s.ref}</div>`:''}<div class="ornement">✦</div>`;
  } else if(s.type==='commentaire'){
    html=`<div class="badge-jou">${s.badge} · ${s.num}/${s.total}</div><div class="sep"></div><div class="commentaire">${s.texte}</div>`;
  } else if(s.type==='liy_final'){
    html=`<div class="badge-jou">${s.badge}</div><div class="sep"></div><div class="liy-final">${s.texte}</div><div class="ornement">✦ ✦ ✦</div>`;
  }
  const old=wrap.querySelector('.slide.actif');
  if(old){old.classList.remove('actif');old.classList.add('sortant');setTimeout(()=>old.remove(),900);}
  const div=document.createElement('div');div.className='slide actif';div.innerHTML=html;wrap.appendChild(div);
  const pct=((idx+1)/slides.length)*100;
  document.getElementById('barre-prog').style.width=pct+'%';
  document.getElementById('indicateur').textContent=`${idx+1} / ${slides.length}`;
  document.getElementById('btn-prev').disabled=(idx===0);
  document.getElementById('btn-next').disabled=(idx===slides.length-1);
}

function naviguer(dir){const nv=idxActif+dir;if(nv<0||nv>=slides.length)return;idxActif=nv;rendSlide(idxActif);}

const audio=document.getElementById('audio');
let muzikOn=false;
function toggleMuzik(){if(muzikOn){audio.pause();muzikOn=false;document.getElementById('btn-muzik').textContent='🎵';}else{audio.play().catch(e=>console.log(e));muzikOn=true;document.getElementById('btn-muzik').textContent='🔇';}}

let vwaOn=false;
function toggleVwa(){
  const av=document.getElementById('audio-vwa');
  const btn=document.getElementById('btn-vwa');
  if(vwaOn){av.pause();vwaOn=false;btn.textContent='🎙';}
  else{av.play().catch(e=>console.log(e));vwaOn=true;btn.textContent='⏸';}
}

// Lè vwa a fini — montre bouton play ankò
document.getElementById('audio-vwa').addEventListener('ended',()=>{
  document.getElementById('btn-vwa').textContent='🎙';
  vwaOn=false;
});

function demarrer(){
  const ec=document.getElementById('ecran-accueil');
  ec.classList.add('cache');setTimeout(()=>ec.remove(),1300);
  // Muzik background — volume ba (0.25)
  audio.volume=0;
  audio.play().catch(e=>console.log(e));muzikOn=true;
  document.getElementById('btn-muzik').textContent='🔇';
  let v=0;const fi=setInterval(()=>{v=Math.min(0.12,v+0.005);audio.volume=v;if(v>=0.12)clearInterval(fi);},150);
  // Vwa — kòmanse apre 1.5s
  // Vwa — kòmanse apre 1.5s sèlman si li deja chaje
  const av=document.getElementById('audio-vwa');
  if(av.src && av.src!==window.location.href){
    av.load();
    // Lè vwa fini — remonte mizik background la
    av.addEventListener('ended', ()=>{
      vwaOn=false;
      document.getElementById('btn-vwa').textContent='🎙';
      if(muzikOn){ let v=audio.volume; const fi=setInterval(()=>{v=Math.min(0.12,v+0.003);audio.volume=v;if(v>=0.12)clearInterval(fi);},100); }
    });
    setTimeout(()=>{
      av.play().then(()=>{
        vwaOn=true;
        document.getElementById('btn-vwa').textContent='⏸';
      }).catch(e=>console.log('Vwa:', e));
    }, 1800);
  }
  rendSlide(0);
}
</script>
</body>
</html>
