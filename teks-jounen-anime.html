d ak dirab bati."}, {"jour": 8, "yom": "Ereb Shabbath", "nomJou": "Ereb Shabbath", "soir_debut": "2026-07-23", "soir_fin": "2026-07-24", "ref": "2 Timotheos 4:17", "texte_kw": "« Adôn lan te kanpe toupre m e li te ban m pisans, dekwa pou, grasa mwen, predikasyon an ka fèt nèt, e pou tout nasyon yo ka tande mesaj la. »", "commentaire": "Lè Sha'oul te ekri dezyèm lèt li bay Timotheos la, li te deja prizonye a Rome e li te konnen fen lavi l te toupre. Li eksplike lè l te parèt devan otorite yo pou premye fwa, prèske tout moun te abandone l. Malgre sa, li pa t kite dekourajman anvayi l, paske l te santi prezans Adôn lan bò kote l.\n\nSe poutèt sa li te deklare: \"Adôn lan te kanpe toupre m e li te ban m pisans.\" Objektif fòs sa a pa t sèlman pou delivre Sha'oul anba yon sitiyasyon difisil, men sitou pou l te kapab akonpli misyon Yahawah te konfye l la. Menm anba chenn, li te kontinye pwoklame Besorah Tobah a pou moun ki soti nan tout nasyon yo te kapab tande Dabar Yahawah a.\n\nPou Membres La Voie yo, pasaj sa a raple yo sèvis Yahawah pa depann de sikonstans favorab. Menm lè yon tal'mid santi l pou kont li, lè lòt moun vire do ba li oswa lè opozisyon leve kont li, Yahawah kapab toujou ba l fòs pou kontinye fè volonte L.\n\nPasaj sa a ankouraje nou tou pou n pa mezire siksè sèvis nou dapre kantite moun ki kanpe bò kote n, men dapre fidelite nou anvè misyon Yahawah ban nou an. Menm jan Sha'oul te kontinye pwoklame Dabar la nan prizon, chak tal'mid dwe rete dispoze bay temwayaj sou laverite, kèlkeswa sikonstans li rankontre.\n\nNou nan Ereb Shabbath, vèsè sa a envite nou antre nan jou repo Yahawah a avèk rekonesans ak konfyans. Menm jan Yahawah te soutni Sha'oul jouk li te fini travay li, Li kapab soutni chak tal'mid ki mete tout konfyans li nan Li epi ki kontinye mache fidèl sou Ha'Derekh la.", "liy_final": "Lè Yahawah konfye yon tal'mid yon misyon, Li ba l fòs pou l akonpli l. Se poutèt sa, okenn opozisyon pa dwe fè nou sispann pwoklame Dabar Yahawah avèk kouraj ak fidelite."}, {"jour": 9, "yom": "Shabbath", "nomJou": "Shabbath", "soir_debut": "2026-07-24", "soir_fin": "2026-07-25", "ref": "Yeshaʿeyah 65:14", "texte_kw": "« Gade! Sèvitè m yo ap chante ak lajwa poutèt bonte ki ranpli kè yo; men nou menm, n ap rele poutèt doulè ki nan kè nou, e n ap plenn akoz yon rouaḥ ki kraze. »", "commentaire": "Nan dènye chapit liv Yeshaʿeyah a, Yahawah fè yon diferans klè ant de kategori moun. Gen moun ki kontinye rejte apèl Li yo, ki chwazi pwòp chemen pa yo epi ki pa pran plezi fè volonte L. Anfas yo, gen ʿEbedim Yahawah yo, moun ki rete fidèl malgre opozisyon ak eprèv.\n\nSe nan kontèks sa a Yahawah anonse konsekans de chwa sa yo. Li pwomèt ʿEbedim Li yo ap jwenn lajwa, paske yo kontinye mache nan favè Li. Tandiske, moun ki vire do ba Li pral fè eksperyans tristès ak desepsyon. Kontrèman an pa soti nan preferans Yahawah pou yon gwoup kont yon lòt, men nan repons diferan chak moun bay apèl Li a.\n\nPou Membres La Voie yo, pasaj sa a raple yo vrè lajwa pa depann de richès, siksè oswa absans pwoblèm. Lajwa Yahawah pwomèt la soti nan relasyon yon tal'mid genyen avèk Li ak nan asirans li genyen ke l ap mache ann amoni ak Dabar Li a.\n\nPafwa, yon tal'mid ka rankontre opozisyon, enkonpreyansyon oswa soufrans. Men sa pa retire lajwa ki nan kè l, paske l konnen Yahawah wè fidelite l epi L pap bliye sèvis li. Lajwa sa a pa yon santiman pasajè; li se rezilta konfyans yon moun mete nan pwomès Yahawah yo.\n\nAn menm tan, pasaj la envite chak moun egzamine pwòp chemen l. Kesyon an pa sèlman si nou fè pati yon asanble, men si nou vrèman ap viv tankou ʿEbedim Yahawah, avèk teshoubah, obeyisans e fidélité. Se moun sa yo Yahawah pwomèt k ap ranpli ak lajwa, menm lè sikonstans yo difisil.", "liy_final": "Lè yon tal'mid chwazi rete fidèl devan Yahawah, lajwa l pa depann de sa k ap pase bò kote l, men de bonte Yahawah ki ranpli kè l epi ki soutni l chak jou."}, {"jour": 10, "yom": "Yôm Rishon", "nomJou": "Yôm Rishon", "soir_debut": "2026-07-25", "soir_fin": "2026-07-26", "ref": "1 Thessaloniciens 5:11", "texte_kw": "« Kidonk, se pou youn kontinye ankouraje lòt e se pou youn kontinye fòtifye lòt, menm jan nou deja ap fè sa. »", "commentaire": "Nan fen premye lèt li te voye bay qehilah Thessalonik lan, Sha'oul t ap ankouraje tal'midim yo pou yo rete vijilan pandan y ap tann akonplisman pwomès Yahawah yo. Li raple yo yo se pitit limyè, kidonk yo pa dwe viv nan neglijans oswa nan dekourajman, men yo dwe rete fèm nan émounah, nan lanmou ak nan espwa.\n\nSe nan kontèks sa a li te di yo: \"Se pou youn kontinye ankouraje lòt e se pou youn kontinye fòtifye lòt.\" Sha'oul rekonèt qehilah a te deja ap viv nan lespri sa a, men l t ankouraje yo pou yo pat sispann fè sa. Li montre lavi yon tal'mid pa fèt pou l viv pou kont li; Yahawah vle pou chak manm qehilah a ede lòt yo rete fèm, sitou lè eprèv oswa fatig parèt.\n\nPou Membres La Voie yo, pasaj sa a raple yo chak tal'mid gen yon responsablite anvè lòt yo. Pawòl nou, atitid nou ak aksyon nou dwe sèvi pou leve kouraj akhim ak akhayot nou yo, pa pou dekouraje yo. Yon senp mo ankourajman, yon jès lanmou oswa yon prezans fidèl kapab ede yon moun kontinye mache sou Ha'Derekh la.\n\nPasaj la envite nou tou pou nou pa izole tèt nou. Yahawah, atravè Pitit Gason l lan Yahushuʿah òganize qehilah a pou chak manm kapab jwenn soutyen lè li fèb epi, an retou, vin yon sous fòs pou lòt moun. Se konsa tout kò a grandi ansanm nan inite ak matirite roḥanit.\n\nNan yon monn kote anpil moun ap viv anba chay, laperèz ak dekourajman, Membres La Voie yo dwe rekonèt enpòtans pou yo toujou sèvi kòm yon sous ankourajman. Lè nou ede yon lòt tal'mid rete fèm, nou patisipe nan travay Yahushuʿah ap fè pou bati qehilah Li a.", "liy_final": "Yon qehilah vin solid lè chak tal'mid chwazi ankouraje, soutni ak fòtifye lòt yo. Se konsa lanmou Yahawah vin vizib nan mitan pèp Li a, epi tout moun grandi ansanm nan fidélité."}, {"jour": 11, "yom": "Yôm Shéni", "nomJou": "Yôm Shéni", "soir_debut": "2026-07-26", "soir_fin": "2026-07-27", "ref": "Debarim 32:31", "texte_kw": "« Paske Wòch nou an pa tankou wòch pa yo; menm ènmi nou yo rekonèt sa. »", "commentaire": "Pawòl sa yo soti nan Chante Mosheh a, yon temwayaj Yahawah te mande Mosheh chante devan Yisra'el pou sèvi kòm yon rapèl sou fidelite L ak sou konsekans dezobeyisans pèp la. Nan chante sa a, Yahawah prezante tèt Li kòm Wòch pèp Li a, sa vle di Sila ki estab, ki fidèl, ki pwoteje epi ki soutni moun ki mete konfyans yo nan Li.\n\nLè Mosheh di: \"Wòch nou an pa tankou wòch pa yo,\" li montre pa gen okenn lòt otorite, okenn lòt fòs oswa okenn lòt sa moun mete konfyans yo ladan l ki kapab konpare ak Yahawah. Nasyon ki t ap adore zidòl yo te wè diferans lan lè Yahawah te delivre pèp Li a epi L te jije ènmi yo. Se poutèt sa menm ènmi Yisra'el yo te oblije rekonèt siperyorite Yahawah, menm si yo pa t vle sèvi L.\n\nPou Membres La Voie yo, vèsè sa a raple yo se Yahawah sèlman ki merite tout konfyans yo. Nan lavi a, anpil moun chèche sekirite nan richès, pouvwa, enfliyans oswa kapasite lèzòm. Men tout bagay sa yo kapab disparèt byen vit. Yahawah, li menm, rete menm jan an; Li pa janm chanje, e pwomès Li yo toujou sèten.\n\nPasaj sa a envite chak tal'mid egzamine sou ki fondasyon l bati lavi l. Lè eprèv rive, èske nou konte an premye sou resous lèzòm, oswa èske nou chèche Yahawah avèk tout kè nou? Yon moun ki pran Yahawah kòm Wòch li jwenn estabilite menm lè tout bagay sanble ap souke bò kote l.\n\nAnplis, fason Membres La Voie yo viv kapab fè lòt moun rekonèt diferans Yahawah fè nan lavi moun ki rete fidèl devan L. Menm jan nasyon yo te rekonèt Wòch Yisra'el la, konduit tal'midim yo dwe rann temwayaj sou grandè ak fidelite Yahawah.", "liy_final": "Lè Yahawah se Wòch yon tal'mid, li jwenn yon fondasyon ki pa janm brannen. Se sou fidelite Yahawah, pa sou fòs lèzòm, lavi ki dire toutbon bati."}, {"jour": 12, "yom": "Yôm Shlishi", "nomJou": "Yôm Shlishi", "soir_debut": "2026-07-27", "soir_fin": "2026-07-28", "ref": "2 Dibrei haYamim 22:9", "texte_kw": "« Yo t ap chèche Aḥazyahou. Yo mete men sou li pandan l t ap kache nan Shomeron. Yo mennen l bay Yahou, ki fè yo touye l. Apre sa, yo antere l, paske yo te di: 'Se desandan Yahoushaphat, sila a ki te chèche Yahawah ak tout kè l.' Men, pa t gen okenn moun nan kay Aḥazyahou ki te gen fòs pou kenbe wayòm nan. »", "commentaire": "Aḥazyahou te vin wa Yéhoudah apre lanmò papa l, men li pa t suiv egzanp granpapa l, Yahoushaphat, ki te chèche Yahawah ak tout kè li. Okontrè, li te kite manman l, Athalyah, ak fanmi Aḥab la enfliyanse l pou l fè sa ki mal devan Yahawah. Li te menm fè alyans ak wa Yisra'el la epi l te antre nan konfli ki pa t ann amoni ak volonte Yahawah.\n\nLè Yahou te resevwa misyon pou egzekite jijman Yahawah sou kay Aḥab la, Aḥazyahou te eseye chape anba jijman an lè l al kache nan Shomeron. Men yo jwenn li, yo mennen l bay Yahou, epi yo touye l.\n\nMalgre move konduit li, yo ba l yon antèman, pa poutèt pwòp fidelite pa l, men paske l te desandan Yahoushaphat, yon wa ki te chèche Yahawah ak tout kè l. Apre lanmò Aḥazyahou, kay li a te vin san fòs pou kontinye dirije wayòm nan.\n\nPou Membres La Voie yo, pasaj sa a montre eritaj yon fanmi ki fidèl se yon benediksyon, men li pa ranplase fidelite pèsonèl chak moun. Aḥazyahou te benefisye respè moun te genyen pou Yahoushaphat, men sa pa t anile konsekans pwòp chwa l yo. Chak moun gen responsablite pa l devan Yahawah.\n\nPasaj la raple nou tou move konpayi ak move enfliyans kapab mennen menm yon moun ki soti nan yon bon fanmi pran move desizyon. Se poutèt sa yon tal'mid dwe chwazi ak anpil disèneman moun li koute, moun li imite ak alyans li antre ladan yo.\n\nAnfen, istwa Aḥazyahou a montre pèsonn pa ka kache pou chape anba jijman Yahawah. Men, moun ki chèche Yahawah ak tout kè yo, menm jan Yahoushaphat te fè sa, kite yon eritaj k ap kontinye sèvi kòm yon temwayaj pou jenerasyon k ap vini an apre yo.", "liy_final": "Yon bon eritaj kapab onore non yon fanmi, men se fidelite pèsonèl chak moun k ap detèmine relasyon l avèk Yahawah ak avni l devan L."}, {"jour": 13, "yom": "Yôm Rebi'i", "nomJou": "Yôm Rebi'i", "soir_debut": "2026-07-28", "soir_fin": "2026-07-29", "ref": "Tehillim 51:9", "texte_kw": "« Vire figi w pou w pa gade devyasyon m yo, epi efase tout erè m yo. »", "commentaire": "Tehillim 51 an se youn nan pi bèl ekspresyon teshoubah nou jwenn nan Ketubim Qedoshim yo. Dāwīḍ te konpoze chante sa a apre Nabī Nathan te vin montre l gravite devyasyon l te fè nan dosye Bath-Sheba ak Ouryah. Olye l te chèche jistifye tèt li oswa kache fot li, Dāwīḍ te rekonèt devyasyon l devan Yahawah epi l mande mizèrikòd.\n\nLè l di: \"Vire figi w pou w pa gade devyasyon m yo,\" li pat mande Yahawah pou L fè kòm si devyasyon l yo pa t egziste. Li sipliye Yahawah pou L padone l epi pou L pa trete l dapre sa l merite. Lè li ajoute: \"Efase tout erè m yo,\" li montre l pa t bezwen yon padon ki an aparans sèlman, men yon padon reyèl ki soti nan mizèrikòd Yahawah epi ki retabli relasyon l avè L.\n\nPou Membres La Voie yo, pasaj sa a montre chemen ki mennen nan padon toujou kòmanse ak yon kè ki rekonèt fot li. Yahawah pa pran plezi nan eskiz oswa nan ipokrizi; Li pran plezi nan yon moun ki admèt devyasyon l, ki fè teshoubah ak tout kè l epi ki deside chanje fason l ap viv.\n\nVèsè sa a ankouraje chak tal'mid pou l egzamine lavi l regilyèman devan Yahawah. Lè nou tonbe, nou pa dwe kouri lwen Yahawah; okontrè, nou dwe pwoche bò kote L avèk imilite, paske L pare pou montre mizèrikòd bay moun ki retounen jwenn Li avèk yon kè sensè.\n\nAn menm tan, padon Yahawah pa yon lisans pou kontinye nan menm move chemen an. Lè L efase erè nou yo, L envite n viv yon lavi ki pi pwòp, ki pi fidèl e ki pi ann amoni ak Dabar Li. Se konsa teshoubah vin pote vrè fwi nan lavi yon tal'mid.", "liy_final": "Vrè teshoubah pa sèlman mande padon; li chèche yon kè renouvle ki detèmine pou mache fidèl devan Yahawah chak jou."}, {"jour": 14, "yom": "Yôm Ḥamishi", "nomJou": "Yôm Ḥamishi", "soir_debut": "2026-07-29", "soir_fin": "2026-07-30", "ref": "Romains 2:4", "texte_kw": "« Èske w meprize richès bonte 'Èlohim, pasyans li ak longanimite l, paske w pa konnen se grasa bonte 'Èlohim gen lakay li ki fè l vle w fè teshubah? »", "commentaire": "Nan kòmansman lèt li te voye bay tal'midim ki t a Rome yo, Sha'oul montre tout limanite bezwen mizèrikòd Yahawah. Apre l fin pale sou move konduit nasyon yo, li vire sou moun ki t ap kondane lòt yo pandan yo menm tou yo t ap pratike bagay ki pa t ann amoni ak volonte Yahawah. L avèti yo pou yo pa konfonn pasyans Yahawah ak apwobasyon.\n\nSe nan kontèks sa a l te poze kesyon an: \"Èske w meprize richès bonte 'Èlohim, pasyans li ak longanimite l?\" Sha'oul montre lefètke Yahawah pa egzekite jijman L tousuit pa vle di L dakò ak devyasyon. Okontrè, bonte, pasyans ak longanimite L se yon demonstrasyon mizèrikòd ki bay moun tan pou yo fè teshubah. Objektif Yahawah se pa detwi pèsonn san avètisman, men ba yo tout posiblite pou yo retounen jwenn Li.\n\nPou Membres La Voie yo, pasaj sa a raple yo chak nouvo jou se yon prèv bonte Yahawah. Lè L kontinye montre pasyans, se pa paske L neglije devyasyon yo, men paske L vle wè moun chanje chemen yo epi retounen vin jwenn Li avèk tout kè yo.\n\nVèsè sa a envite chak tal'mid pou y egzamine pwòp lavi yo. Li fasil pou wè fot lòt moun, men Sha'oul ankouraje n pou n kòmanse pa gade pwòp kè nou. Lè Yahawah montre nou mizèrikòd, repons ki apwopriye a se pa pran tan sa a pou nou kontinye nan menm move chemen an, men pou n fè teshubah san pèdi tan.\n\nAn menm tan, pasaj sa a ede n devlope menm kalite Yahawah genyen. Menm jan L montre bonte ak pasyans anvè nou, nou menm tou nou dwe montre pasyans ak konpasyon anvè lòt moun, pandan n ap ankouraje yo retounen sou Ha'Derekh la. Bonte Yahawah pa ankouraje neglijans; li ouvri pòt pou restorasyon.", "liy_final": "Bonte Yahawah se pa yon pèmisyon pou kontinye nan devyasyon; men l se yon envitasyon plen lanmou pou n fè teshubah pandan pòt mizèrikòd Li a toujou louvri."}, {"jour": 15, "yom": "Ereb Shabbath", "nomJou": "Ereb Shabbath", "soir_debut": "2026-07-30", "soir_fin": "2026-07-31", "ref": "1 Corinthiens 16:13", "texte_kw": "« Rete vijilan; kanpe fèm nan émounah; montre nou vanyan, epi vin djanm. »", "commentaire": "Vèsè sa a fè pati dènye ankourajman Sha'oul te bay qehilah Corinthe lan. Pandan tout lèt la, li te korije plizyè pwoblèm ki t ap divize asanble a: divizyon, move konduit, pwosè ant manm yo, dezòd pandan reyinyon yo ak move konpreyansyon sou rezirèksyon. Anvan l fini lèt la, li kite yo ak kat gwo egzòtasyon ki mache ansanm: rete vijilan, kanpe fèm nan émounah, montre nou vanyan, epi vin djanm.\n\nLè Sha'oul mande yo rete vijilan, l ankouraje yo pou yo pa kite fo ansèyman, tantasyon oswa neglijans fè yo vire do bay laverite. Lè l di kanpe fèm nan émounah, l envite yo rete fidèl ak Dabar Yahawah a malgre tout presyon yo. Finalman, lè l mande yo montre yo vanyan epi vin djanm, li pa ankouraje yo konte sou pwòp fòs yo, men pou yo jwenn kouraj nan konfyans yo mete nan Yahawah.\n\nPou Membres La Voie yo, pasaj sa a raple yo lavi yon tal'mid mande vijilans chak jou. Gen anpil enfliyans, anpil ansèyman ak anpil sediksyon ki ka fè yon moun pèdi direksyon l si l pa rete atache ak Dabar Yahawah a.\n\nKanpe fèm nan émounah vle di kontinye suiv prensip Yahawah yo menm lè majorite a chwazi yon lòt chemen. Sa mande detèminasyon, paske pafwa fidelite gen yon pri. Men Yahawah pa janm abandone moun ki chwazi rete fidèl devan L.\n\nNan moman Ereb Shabbath la, vèsè sa a envite nou antre nan jou repo Yahawah a avèk yon kè ki pare pou kontinye batay bon batay la. Shabbath la pa sèlman yon tan pou repoze kò a; li se tou yon moman pou renouvle detèminasyon nou pou rete vijilan, fòtifye émounah nou epi reprann fòs pou kontinye mache nan Ha'Derekh la.", "liy_final": "Yon tal'mid ki rete vijilan, ki kanpe fèm nan émounah epi k jwenn fòs li nan Yahawah pap fasil brannen. Se konsa l kontinye mache avèk kouraj nan Ha'Derekh la, jouk nan bout."}, {"jour": 16, "yom": "Shabbath", "nomJou": "Shabbath", "soir_debut": "2026-07-31", "soir_fin": "2026-08-01", "ref": "Mattiyahu 24:21", "texte_kw": "« Pral gen yon tsarah ghedhôlah (yon peryòd detrès ekstrèm, yon presyon san parèy), yon tsarah ki poko janm rive depi monn nan egziste pou jiska prezan, non, e ki pap janm rive ankò. »", "commentaire": "Nan Mattiyahu 24, Yahushuʿah te reponn tal'midim Li yo apre yo te poze L kesyon konsènan destriksyon Tanp lan, siy Nokheḥut Li ak konklizyon sistèm nan. Li avèti yo sou fo Mashiaḥ, lagè, grangou, tranblemanntè, pèsekisyon ak lòt evènman ki t ap mande anpil vijilans ak andirans.\n\nNan vèsè 15-20 yo, diskou a vin pi ijan. Yahushuʿah pale de « bagay degoutan ki lakòz dezolasyon an », Nabī Daniy'el te anonse a, epi L mande moun ki nan Yéhoudah yo pou yo kouri ale nan mòn yo lè moman an rive. Se nan kontèks avètisman sa a L anonse yon tsarah ghedhôlah.\n\nEkspresyon \"tsarah ghedhôlah\", soti nan lang ibri e li pote lide yon detrès ki ekstrèm, yon presyon ki kraze moun, yon sitiyasyon san parèy. Yahushuʿah mete aksan sou gravite l lè L di pa t janm gen yon tsarah konsa anvan e pap gen youn konsa ankò.\n\nVèsè ki vin apre a montre dimansyon kriz la: si jou sa yo pa t vin pi kout, « pa gen okenn chè ki t ap sove »; men poutèt moun Yahawah chwazi yo, jou sa yo ap vin pi kout (Mattiyahu 24:22). Kidonk, pawòl Yahushuʿah yo pa fèt pou nouri kiryozite oswa laperèz; yo se yon avètisman pou prepare, rete vijilan epi andire.\n\nPou Membres La Voie yo, pasaj sa a mande plis pase konnen definisyon tsarah ghedhôlah. Kesyon ki pi enpòtan an se: Ki kalite moun nou dwe ye anvan yon moman konsa rive?\n\nYahushuʿah pa mande tal'midim Li yo pou yo viv nan panik. Li mande yo pou yo rete vijilan, pa kite pèsonn twonpe yo, pa kite lanmou yo vin frèt, epi andire jouk nan bout (Mattiyahu 24:4, 12, 13). Se kounye a pou nou fòtifye émounah nou, verifye sa nou kwè, rete atache ak Dabar Yahawah a epi aprann obeyi Yahushuʿah san ezitasyon.\n\nTsarah ghedhôlah a raple nou tou sekirite yon tal'mid pa dwe repoze sèlman sou byen materyèl, enstitisyon oswa fòs lèzòm. Yon kriz san parèy kapab souke bagay moun te kwè ki estab yo. Se poutèt sa relasyon nou avèk Yahawah, obeyisans nou anvè Yahushuʿah ak preparasyon roḥanit nou pa bagay pou n remèt pou demen.\n\nNan moman Shabbath la, tèks sa a bay yon rezon anplis pou nou itilize jou Yahawah la pou egzamine tèt nou, fòtifye youn lòt epi prepare lespri nou. Objektif la se pa pè tsarah a; objektif la se rete fidèl lè presyon an va rive.", "liy_final": "Tsarah ghedhôlah a pral teste sa ki vrèman solid. Se poutèt sa Yahushuʿah pa di tal'midim Li yo pou yo panike, men pou yo rete vijilan, pou yo prepare yo, kanpe fèm nan émounah epi andire jouk sa kaba."}, {"jour": 17, "yom": "Yôm Rishon", "nomJou": "Yôm Rishon", "soir_debut": "2026-08-01", "soir_fin": "2026-08-02", "ref": "Romains 10:4", "texte_kw": "« Mashiaḥ la li menm se aboutisman — objektif final — Torah a, pou tout moun ki demontre émounah ka resevwa estati yon moun ki jis. »", "commentaire": "Nan Romains chapit 9 ak 10, Sha'oul t ap eksplike poukisa anpil nan pèp Yisra'el la pa t rive jwenn jistis Yahawah te pwomèt la. Li fè konnen yo te gen anpil zèl pou Yahawah, men zèl sa a pa t baze sou konesans egzat. Yo t ap chèche etabli pwòp jistis pa yo olye yo soumèt devan fason Yahawah fè yon moun vin jis.\n\nSe nan kontèks sa a li te deklare: \"Mashiaḥ la li menm se aboutisman — objektif final — Torah a.\" Mo ibri סוֹף (sof) pa vle di sèlman fen nan sans yon bagay sispann egziste. Li kapab vle di tou objektif, akonplisman oswa rezilta final. Sha'oul montre tout sa Torah a te anseye, tout lonbraj li yo, tout nebu'ot li yo ak tout objektif li yo te mennen sou Mashiaḥ la. Se Li menm ki reyalize sa Torah a t ap prepare depi nan kòmansman an.\n\nKidonk, Sha'oul pa t ap di Torah a pa gen valè ankò. Li t ap montre de preferans Mashiaḥ la se akonplisman plan Yahawah Torah a te anonse a, pou tout moun ki demontre émounah nan Li resevwa estati yon moun ki jis.\n\nPou Membres La Voie yo, pasaj sa a raple yo pa gen okenn opozisyon ant Torah Yahawah ak Yahushuʿah Ha'Mashiaḥ. Okontrè, Yahushuʿah revele vrè sans ak objektif Torah a. Yon tal'mid k ap suiv Yahushuʿah pa vire do bay volonte Yahawah; l antre pi fon nan konpreyansyon l.\n\nPasaj sa a ankouraje nou pou nou pa chèche jistifye tèt nou grasa pwòp efò pa nou oswa grasa tradisyon lèzòm. Estati yon moun ki jis se yon favè Yahawah bay moun ki demontre émounah nan Mashiaḥ la epi ki mache nan obeyisans anvè Dabar Li a.\n\nAn menm tan, vèsè sa a envite nou etidye Torah a avèk je Yahushuʿah. Lè nou li Ketubim Qedoshim yo, nou wè kijan tout plan Yahawah a montre sou Mashiaḥ la epi jwenn akonplisman l nan misyon L. Sa ranfòse émounah nou epi ede nou konprann inite tout Dabar Yahawah a.", "liy_final": "Mashiaḥ Yahushuʿah pa vin anile Torah Yahawah a; Li se objektif final li, akonplisman li ak reyalizasyon tout sa Yahawah te anonse depi nan kòmansman, pou tout moun ki demontre émounah resevwa estati yon moun ki jis."}, {"jour": 18, "yom": "Yôm Shéni", "nomJou": "Yôm Shéni", "soir_debut": "2026-08-02", "soir_fin": "2026-08-03", "ref": "Maʿasei 24:15", "texte_kw": "« Espwa m gen nan 'Èlohim, e se espwa sa a mesye sa yo genyen tou: Pral gen yon rezirèksyon ni pou moun ki jis, ni pou moun ki enjis. »", "commentaire": "Pawòl sa yo soti nan defans shilliaḥ Sha'oul devan gouvènè Felix. Li montre espwa rezirèksyon an pa t yon nouvo ansèyman l te envante, men yon pwomès Yahawah te deja fè konnen nan Torah a ak nan Nebi'im yo (Yeshaʿeyahou 26:19; Daniyyel 12:2).\n\nKetubim Qadoshim yo montre rezirèksyon an pap fèt yon sèl kou pou tout moun. Yahawah fikse yon lòd nan rezirèksyon yo. Premyèman, Yahushuʿah Ha'Mashiaḥ se premye moun Yahawah leve pou l pa janm mouri ankò. Li se premye fwi rezirèksyon an (1 Corinthiyim 15:20-23).\n\nApre sa, lè Yahushuʿah ap nokheḥut nan kâbôd Li, moun ki fè pati L yo ap leve nan rezirèksyon an (1 Thessalonikiyim 4:16-17; 1 Corinthiyim 15:23, 51-53). Apre rèy Mashiaḥ la fin rive nan objektif li, rès mò yo ap leve tou pou yo parèt devan Yahawah.\n\nSe lè sa a moun ki enjis yo ap resevwa rezirèksyon pa yo, pou yo kanpe devan jijman Yahawah (Hazon 20:5, 11-13; Yaḥuānān 5:28, 29). Se poutèt sa Sha'oul di pral gen yon rezirèksyon ni pou moun ki jis, ni pou moun ki enjis, men se pa menm moman an, ni se pa pou menm objektif la.\n\nPou Membres La Voie yo, pasaj sa a raple yo espwa yo pa fini nan tonm lan. Yahawah gen pouvwa pou l rele mò yo tounen vivan, menm jan L te leve Yahushuʿah. L ap pase Yahushuʿah pou l leve moun ki mouri yo. Se espwa sa a ki te bay premye tal'midim yo fòs pou yo andire pèsekisyon, e menm lanmò.\n\nAn menm tan, lefètke pral gen yon rezirèksyon pou tout moun montre lavi nou gen konsekans. Chak moun ap kanpe devan Yahushuʿah pou yo rann kont. Se poutèt sa yon tal'mid pa dwe viv sèlman pou jodi a; li dwe prepare l pou jou Yahushuʿah pral rele l.\n\nPasaj sa a ankouraje Membres La Voie yo pou yo kontinye mache avèk fidélité, menm lè yo pèdi moun yo renmen. Lanmò pa efase pwomès Yahawah yo. Moun ki dòmi nan lanmò pandan yo rete fidèl gen espwa pou yo leve ankò lè Yahawah va akonpli pwomès Li a.", "liy_final": "Rezirèksyon an se youn nan pi gwo espwa Yahawah bay limanite. Yahushuʿah se premye fwi a; apre sa, moun ki pou Li yo ap leve lè Li va prezan; epi tout rès limanite ap leve pou parèt devan jijman jis Yahushuʿah. Se poutèt sa chak tal'mid dwe viv chak jou avèk émounah, pandan l ap tann ak konfyans jou Yahushuʿah pral rele mò yo tounen vivan ankò."}, {"jour": 19, "yom": "Yôm Shlishi", "nomJou": "Yôm Shlishi", "soir_debut": "2026-08-03", "soir_fin": "2026-08-04", "ref": "Yeshaʿeyah 29:13", "texte_kw": "« Yahawah di: 'Se nan bouch pèp sa a pwoche kote m, e se nan bouch yo onore m, men, kè yo byen lwen m. Epi, lakrentif yo di yo gen pou mwen an chita sou kòmandman yo resevwa nan men lèzòm.' »", "commentaire": "Nabi Yeshaʿeyah te adrese pawòl sa yo ak pèp Yéhoudah a nan yon epòk kote tout pandan yo t ap kontinye fè sèvis yo ak tout seremoni yo, men lavi yo pa t ann amoni ak volonte Yahawah. Yo t ap pwononse bèl pawòl, yo t ap patisipe nan adorasyon an, men kè yo pa t vrèman atache ak Yahawah.\n\nYahawah te denonse yon adorasyon ki te vin tounen yon abitid (routin) san lavi. Olye yo te kite Dabar Li a gide yo, yo te bay plis enpòtans ak règ, tradisyon ak kòmandman lèzòm. Se poutèt sa L di lakrentif yo te pretann yo genyen pou Li a pa t baze sou sa L te anseye, men depreferans sou sa lèzòm te mande yo fè.\n\nPlizyè syèk apre, Yahushuʿah te site menm pasaj sa a pou l montre menm pwoblèm nan te kontinye egziste nan epòk Li a. Li repwoche chèf relijye yo dèske yo te mete tradisyon lèzòm pi wo pase Dabar Yahawah a (Mattiyahu 15:7-9; Marqos 7:6, 8).\n\nPou Membres La Voie yo, pasaj sa a se yon envitasyon pou n egzamine kalite adorasyon nou. Li pa sifi pou yon moun konnen oubyen ap di bèl pawòl, chante chirat oswa patisipe nan reyinyon yo. Yahawah gade anvan tout bagay kè moun nan ak volonte l pou l obeyi Dabar Li a.\n\nPasaj sa a raple nou tou pou n toujou verifye ansèyman n ap resevwa yo. Yon tradisyon pa vin laverite sèlman paske l ansyen oswa paske anpil moun ap suiv li. Chak tal'mid Yahushuʿah gen responsabilite pou l egzamine tout bagay sou baz Ketubim Qadoshim yo epi kenbe sèlman sa ki ann amoni ak Dabar Yahawah a.\n\nAnplis, vèsè sa a ankouraje nou n pou relasyon n ak Yahawah pa janm vin yon seri jès otomatik, ki chita sou routin. Chak hitpallah, chak etid, chak sèvis n ap rann dwe soti nan yon kè ki renmen Yahawah epi ki vle fè volonte L. Se yon adorasyon konsa Yahawah, Papa a ap chèche.", "liy_final": "Yahawah pap chèche bouch k ap pale sèlman; L ap chèche moun kè yo fidèl. Vrè adorasyon an bati sou lanmou pou Yahawah ak sou obeyisans anvè Dabar Li a, pa sou tradisyon oswa kòmandman lèzòm."}, {"jour": 20, "yom": "Yôm Rebi'i", "nomJou": "Yôm Rebi'i", "soir_debut": "2026-08-04", "soir_fin": "2026-08-05", "ref": "Éphésiens 6:14", "texte_kw": "« Kenbe fèm, epi mare laverite nan ren nou tankou se yon sentiwon. Mete pwotèj pwatrin jistis la sou nou. »", "commentaire": "Nan dènye pati lèt li te voye bay qehilah Éphèse la, shilliaḥ Sha'oul fè konnen lavi yon tal'mid se yon konba roḥanit. Li fè konprann advèsè tal'midim yo pa sèlman moun, men tout fòs ki opoze ak volonte Yahawah. Se poutèt sa l ankouraje yo pou yo pran tout zam 'Èlohim bay yo, yon fason pou yo kapab kenbe fèm lè moman eprèv yo rive.\n\nLi kòmanse dekri zam sa yo ak de eleman fondamantal. Premye a se sentiwon laverite a. Menm jan yon sòlda nan epòk la te mare sentiwon l anvan nenpòt lòt pati nan ekipman l, yon tal'mid dwe mare lavi l ak laverite Dabar Yahawah a. San laverite, tout rès zam yo pèdi fòs yo.\n\nApre sa, Sha'oul pale de pwotèj pwatrin jistis la. Pwotèj sa a te sèvi pou pwoteje ògàn ki pi enpòtan yo. Menm jan an tou, jistis ki soti nan Yahawah pwoteje lavi roḥanit yon tal'mid, lè l chwazi viv ann amoni ak volonte Yahawah olye l suiv chemen devyasyon an.\n\nPou Membres La Voie yo, pasaj sa a raple yo pa gen viktwa roḥanit san preparasyon. Yon tal'mid pa kapab kanpe fèm si l pa mare lavi l ak laverite Ketubim Qedoshim yo. Nan yon epòk kote anpil fo ansèyman ak tradisyon lèzòm ap sikile, laverite Yahawah se premye pwoteksyon yon tal'mid.\n\nMete pwotèj pwatrin jistis la vle di chwazi fè sa k dwat chak jou, menm lè sa mande sakrifis. Jistis pa limite ak sa yon moun ap di; men l parèt tou nan fason l ap viv, nan desizyon l ap pran ak nan entegrite l devan Yahawah.\n\nPasaj sa a ankouraje chak manm La Voie pou yo egzamine si yo vrèman ekipe pou konba roḥanit sa a. Èske lavi n mare ak laverite? Èske n chèche viv daprè jistis Yahawah? Se sèlman lè de eleman sa yo prezan yon tal'mid kapab rete fèm devan eprèv, tantasyon ak fo ansèyman.", "liy_final": "Yon tal'mid ki mare lavi l ak laverite epi k ap viv nan jistis Yahawah pa fasil brannen. Se zam sa yo ki pèmèt li kanpe fèm epi kontinye mache avèk fidelite sou Ha'Derekh la."}, {"jour": 21, "yom": "Yôm Ḥamishi", "nomJou": "Yôm Ḥamishi", "soir_debut": "2026-08-05", "soir_fin": "2026-08-06", "ref": "Debarim 30:11", "texte_kw": "« Ha-mitswah (kòmandman) m ap ban nou jodi a pa twò difisil pou n rive konprann, ni l pa lwen nou, ni l pa twò difisil pou n obeyi. »", "commentaire": "Nan fen liv Debarim lan, Mosheh rive nan dènye diskou l te bay pèp Yisra'el la anvan yo antre nan Tè Pwomiz la. Li mete devan yo de chwa: lavi oswa lanmò, benediksyon oswa malediksyon, selon si yo obeyi Yahawah oswa si yo vire do ba Li.\n\nSe nan kontèks sa a li di: \"Ha-mitswah m ap ban nou jodi a pa twò difisil...\" Mosheh vle retire nenpòt eskiz. Volonte Yahawah pa t kache, li pa t rezève pou yon ti gwoup moun sèlman, ni li pa t enposib pou pratike. Yahawah te deja fè konnen Dabar Li, e Li te mete l ase pre pou pèp la te kapab aprann li, konprann li epi viv ann amoni avè l.\n\nKèk vèsè apre, Mosheh ajoute: \"Dabar la trè pre w; li nan bouch ou ak nan kè w, pou w mete l an pratik.\" (Debarim 30:14). Sa montre objektif Yahawah pa t sèlman fè moun konnen volonte L, men pou yo viv li chak jou.\n\nPou Membres La Voie yo, pasaj sa a raple yo Yahawah pa mande sa ki enposib. Li pa bay kòmandman pou fè moun echwe; Li bay yo pou gide yo sou chemen lavi a. Lè Yahawah mande yon bagay, Li bay tou mwayen pou yon moun obeyi L, depi l gen yon kè ki dispoze.\n\nPasaj sa a ankouraje nou pou n pa di: \"Sa twò difisil\" oswa \"Mwen pa kapab.\" Olye de sa, yon tal'mid dwe etidye Dabar Yahawah a, mande l direksyon L epi mete sa l aprann yo an pratik chak jou. Se pa kantite konesans sèlman ki fè yon moun grandi, men fidelite l nan aplike sa Yahawah mande.\n\nAnplis, vèsè sa a raple Membres La Voie yo pou yo pa ajoute chay Yahawah pa t mete. Pandan listwa, anpil tradisyon lèzòm te vin fè moun kwè sèvi Yahawah se yon fado lou. Men Yahawah fè konnen Ha-mitswah Li yo fèt pou mennen moun nan lavi, pa pou kraze l.", "liy_final": "Yahawah pa mete devan ebedim Li yo yon chemen enposib. Li mete Dabar Li toupre yo, pou yo konprann li, obeyi l epi jwenn lavi lè yo mache fidèl sou chemen L."}, {"jour": 22, "yom": "Ereb Shabbath", "nomJou": "Ereb Shabbath", "soir_debut": "2026-08-06", "soir_fin": "2026-08-07", "ref": "Maʿasei 8:1", "texte_kw": "« Šāʾūl, bò kote pa l, te dakò dèske yo te touye Tsephan. Jou sa a menm, yon gwo pèsekisyon te kòmanse kont qehilah ki te nan Yerushalayim nan. Tout tal'midim yo te gaye nan tout zòn Yéhoudah ak Shomeron, eksepte shilliaḥim yo. »", "commentaire": "Apre Tsephan te fin rann yon temwayaj pisan devan Sanhedrin an, li te kondane epi yo te touye l. Lanmò l pa t yon zak vyolans izole; li te make kòmansman yon gwo pèsekisyon kont qehilah ki te Yerushalayim lan.\n\nNan moman sa a, Šāʾūl pa t ankò yon tal'mid Yahushuʿah. Li te kwè li t ap defann adorasyon Yahawah lè l t ap konbat Ha'Derekh la. Se poutèt sa l te dakò ak lanmò Tsephan epi, dapre vèsè ki vin an apre yo, li te antre kay an kay pou arete gason ak fi epi mete yo nan prizon (Maʿasei 8:3).\n\nPèsekisyon sa a te fòse anpil tal'mid kite Yerushalayim. Sepandan, sa Satan te vle sèvi pou detwi qehilah a, Yahawah te sèvi avè l pou l fè Besorah Tobah a gaye pi lwen toujou. Tal'midim ki te dispèse yo pa t sispann misyon yo; kote yo te rive, yo te kontinye pwoklame Dabar Yahawah a. Konsa, pwomès Yahushuʿah te bay nan Maʿasei 1:8 la te kòmanse reyalize: temwayaj la t ap rive nan Yéhoudah, Shomeron, epi pita jouk nan bout latè.\n\nPou Membres La Voie yo, pasaj sa a montre opozisyon pa ka anpeche plan Yahawah reyalize. Okontrè, anpil fwa Yahawah sèvi ak eprèv pou l louvri nouvo pòt pou Dabar Li a avanse.\n\nPasaj la raple nou tou yon moun pa dwe jije avni yon lòt dapre sa li ye jodi a. Šāʾūl, ki t ap pèsekite qehilah a avèk anpil zèl, te vin tounen youn nan pi gwo pwoklamatè Besorah Tobah a apre Yahushuʿah te rele l. Sa montre mizèrikòd Yahawah kapab transfòme menm moun ki sanble pi lwen yo.\n\nAnfen, egzanp tal'midim yo ankouraje nou pou n pa kite opozisyon fè nou sispann sèvi Yahawah. Yo pa t kite laperèz fè yo rete an silans; yo te kontinye anonse Dabar la tout kote yo t ale. Menm lè sikonstans yo chanje, misyon yon tal'mid rete menm jan an: fè konnen volonte Yahawah avèk fidélité.", "liy_final": "Pèsekisyon ka dispèse tal'midim yo, men li pa kapab fè Dabar Yahawah a sispann avanse. Lè yon tal'mid rete fidèl, Yahawah kapab menm sèvi ak eprèv yo pou fè Besorah Tobah a rive pi lwen toujou."}, {"jour": 23, "yom": "Shabbath", "nomJou": "Shabbath", "soir_debut": "2026-08-07", "soir_fin": "2026-08-08", "ref": "Colossiens 4:11", "texte_kw": "« Yahushuʿah, yo rele tou Yostos, ki fè pati moun ki sikonsi yo. Se sèlman yo menm ki te konpayon m nan travay pou Malkouth 'Èlohim nan, e yo te vin tounen yon gwo sous ankourajman pou mwen. »", "commentaire": "Nan dènye pati lèt li te voye bay qehilah Colosse la, shilliaḥ Šāʾūl te voye salitasyon pou plizyè konpayon travay li yo. Li mansyone Aristarkhos, Marqos, Epaphras, Louqas ak lòt ankò. Pami yo, li site Yahushuʿah, yo rele tou Yostos.\n\nŠāʾūl presize li te \"fè pati moun ki sikonsi yo\", sa vle di li te yon Yehoudah. L ajoute se sèlman kèk Yehoudim sa yo ki t ap travay ansanm avè l pou Malkouth 'Èlohim lan nan moman sa a, e prezans yo te yon gwo rekonfò pou li pandan l te nan prizon.\n\nLefètke non li se Yahushuʿah, men yo rele l tou Yostos, montre anpil Yehoudim nan premye syèk la te konn pote yon non ibri ansanm ak yon non grèk oswa latin. Men idantite yo kòm Yehoudim pa t chanje poutèt sa. Sa montre tou qehilah premye syèk la te rasanble moun ki soti nan diferan anviwònman, men yo tout t ap travay ansanm pou avansman Malkouth 'Èlohim lan.\n\nPou Membres La Voie yo, pasaj sa a raple yo sèvis Yahawah pa fèt pou yon sèl moun. Menm shilliaḥ Šāʾūl, malgre gwo responsabilite l te genyen, te bezwen konpayon fidèl ki t ap soutni l, ankouraje l epi travay ansanm avè l.\n\nPasaj la montre tou enpòtans fidelite. Šāʾūl pa t fè lwanj konpayon sa yo poutèt popilarite yo, men paske yo te rete fidèl nan sèvis Yahawah, menm lè sa te mande sakrifis. Yo te vin tounen yon gwo sous ankourajman pou li.\n\nPou Membres La Voie yo jodi a, sa se yon envitasyon pou yo pa sèlman chèche resevwa ankourajman, men pou yo vin yon sous ankourajman pou lòt tal'midim yo. Lè nou travay ansanm avèk imilite, sipòte youn lòt epi mete enterè Malkouth 'Èlohim lan an premye, nou kontinye bati qehilah a jan premye tal'midim yo te fè sa.", "liy_final": "Yahushuʿah pa bati qehilah Li a ak moun k ap chèche kâbôd pou tèt yo, men ak tal'mid fidèl k ap travay ansanm, soutni youn lòt epi vin tounen yon sous ankourajman pou avansman Malkouth Li a."}, {"jour": 24, "yom": "Yôm Rishon", "nomJou": "Yôm Rishon", "soir_debut": "2026-08-08", "soir_fin": "2026-08-09", "ref": "Yaḥuānān 6:40", "texte_kw": "« Volonte Papa a se pou tout moun ki rekonèt Pitit la e ki demontre yo gen émounah nan Li gen lavi ki pap janm fini an, e m ap resisite yo nan dènye jou a. »", "commentaire": "Nan Yaḥuānān chapit 6 la, apre Yahushuʿah te fin bay foul la manje, anpil moun te kontinye chèche L. Men Yahushuʿah dirije atansyon yo pi lwen pase manje k ap soutni lavi pou yon ti tan. Li montre yo Yahawah te voye L pou l bay yon bagay ki pi enpòtan: lavi ki pap janm fini an.\n\nYahushuʿah esplike L pa desann soti bò kot Papa a pou fè pwòp volonte pa L, men pou l akonpli volonte Sila ki te voye L la. E youn nan aspè fondamantal volonte sa a se pou moun ki rekonèt Pitit la e ki demontre émounah nan Li jwenn lavi.\n\nMen Yahushuʿah ajoute yon detay kapital: « M ap resisite yo nan dènye jou a. » Donk, lavi ki pap janm fini an pa prezante isit la kòm yon egzistans konsyan k ap kontinye otomatikman apre lanmò. Espwa moun ki mouri yo chita sou rezirèksyon. Moun nan mouri, men Yahawah pa bliye l; nan moman L fikse a, Yahushuʿah ap rele l tounen nan lavi.\n\nYahushuʿah repete menm pwomès la plizyè fwa nan menm diskou a (Yaḥuānān 6:39, 44, 54). Repetisyon sa a mete aksan sou yon verite santral: rezirèksyon an fè pati dirèkteman nan volonte Yahawah pou moun ki fè pati Pitit Li a.\n\nPou Membres La Voie yo, pawòl sa yo bay yon espwa ki solid devan lanmò. Émounah nan Yahushuʿah pa baze sèlman sou sa L kapab fè pou nou kounye a; li rive jouk nan pwomès Li genyen pou l leve moun ki mouri yo.\n\nSa vle di yon tal'mid ki rete fidèl devan Yahawah pa bezwen konsidere lanmò kòm fen tout bagay. Menm si lavi l fini, pwomès Yahushuʿah rete vivan: « M ap resisite l nan dènye jou a. »\n\nPasaj la montre tou li pa sifi pou yon moun sèlman konnen kiyès Yahushuʿah ye. Rekonèt Pitit la mande pou konprann pozisyon Yahawah ba Li, koute L, demontre émounah nan Li epi viv selon ansèyman L yo. Émounah sa a dwe vizib nan fason yon tal'mid ap mache chak jou.\n\nFinalman, vèsè a mete Papa a ak Pitit la nan plas respektif yo: volonte a soti nan Papa a; Pitit la akonpli volonte sa a; epi Yahushuʿah resevwa otorite pou resisite moun Papa a konfye L yo. Konsa, espwa rezirèksyon an chita sou dispozisyon Yahawah mete an plas atravè Pitit Li a.", "liy_final": "Lanmò pa anile pwomès Yahawah yo. Pou moun ki rekonèt Yahushuʿah epi ki demontre émounah nan Li, gen yon randevou ki deja fikse pi lwen pase tonm nan: rezirèksyon nan dènye jou a ak lavi ki pap janm fini an."}, {"jour": 25, "yom": "Yôm Shéni", "nomJou": "Yôm Shéni", "soir_debut": "2026-08-09", "soir_fin": "2026-08-10", "ref": "1 Képha 3:7", "texte_kw": "« Nou menm mari, se pou n […] onore [madanm nou] tankou yon vaz ki pi fèb, yon fason pou téfilot nou yo pa bloke, piske yo menm tou, yo eritye favè san parèy lavi a ansanm ak nou. »", "commentaire": "Nan 1 Képha chapit 3 a, Képha t ap pale sou konduit mari ak madanm nan maryaj. Lè l rive sou mari yo, li mande yo pou yo kontinye viv avèk madanm yo selon konesans, sa vle di avèk konsiderasyon, konpreyansyon ak respè pou pozisyon Yahawah ba yo.\n\nLè Képha rele madanm nan « yon vaz ki pi fèb », li pa prezante fi a kòm yon moun ki gen mwens valè oswa ki enferyè devan Yahawah. Imaj vaz la aplike ak lèzòm kòm kreyati, tandiske « pi fèb » la natirèlman fè referans ak diferans fizik ki egziste an jeneral ant gason ak fi. Se jisteman poutèt sa Képha mande mari a pou l pa sèvi ak avantaj fòs li pou l domine, britalize oswa meprize madanm li; okontrè, li dwe onore l.\n\nKépha ajoute yon rezon ki gen anpil pwa: madanm nan se « eritye favè san parèy lavi a ansanm avèk » mari l. Donk, devan Yahawah, toude resevwa menm espwa lavi a. Diferans nan fonksyon oswa kapasite fizik pa diminye valè madanm nan devan 'Èlohim.\n\nApre sa vini yon avètisman serye: « yon fason pou téfilot nou yo pa bloke. » Sa vle di fason yon mari trete madanm li gen yon rapò dirèk ak relasyon l avèk Yahawah. Yon mari pa ka ap maltrete, meprize oswa manke konsiderasyon pou madanm li epi l panse sèvis li devan Yahawah pa afekte.\n\nPou mari ki fè pati La Voie yo, pasaj sa a mete yon gwo responsabilite sou yo. Otorite nan maryaj pa yon lisans pou yo domine; li mande plis konsiderasyon, plis kontwòl tèt ak plis lanmou. Yon mari dwe aprann konn madanm li: konprann santiman l, limit li, bezwen l, epi pran desizyon avèk konsiderasyon pou li.\n\nOnore madanm li vle di valè l dwe vizib nan fason mari a pale avè l, pale de li devan lòt moun, koute l, pwoteje l epi trete opinyon l avèk respè. Yon mari pa dwe sèvi ak fòs fizik, pozisyon l oswa menm Ketubim yo kòm zouti pou kraze madanm li.\n\nMen Képha ale pi lwen toujou: Yahawah enterese nan fason yon mari trete madanm li. Yon moun ka leve anpil téfilot, men si lakay li l ap maltrete moun Yahawah mande l onore a, li kreye yon obstak nan pwòp relasyon l avèk Yahawah. Adorasyon pa kòmanse sèlman nan qehilah a; li parèt tou nan fason nou trete moun ki pi pre nou yo.\n\nPou madanm yo tou, pawòl « eritye ansanm avèk nou » pote anpil diyite. Yahawah pa konsidere yo kòm yon kategori segondè nan qehilah Li a. Yo resevwa ansanm ak mari yo menm favè san parèy ki mennen nan lavi a.", "liy_final": "Yon mari pa ka separe relasyon l avèk Yahawah ak fason l trete madanm li. Lè l onore madanm li, li rekonèt li kòm yon eritye ansanm avè l nan favè lavi a; men lè l meprize l, menm téfilot li yo kapab jwenn yon obstak devan Yahawah."}, {"jour": 26, "yom": "Yôm Shlishi", "nomJou": "Yôm Shlishi", "soir_debut": "2026-08-10", "soir_fin": "2026-08-11", "ref": "1 Képha 4:1", "texte_kw": "« Piske Mashiaḥ la te soufri nan lachè, nou menm tou, se pou n gen menm mantalite sa a, paske yon moun ki soufri nan lachè fini ak devyasyon. »", "commentaire": "Nan premye lèt li a, Képha ap ankouraje tal'midim Yahushuʿah yo ki t ap sibi presyon ak soufrans poutèt yo te chwazi viv ann amoni ak volonte Yahawah. Nan fen chapit 3 a, li mete devan yo egzanp Mashiaḥ la, ki te soufri malgre L t ap fè sa k dwat.\n\nSe sou baz egzanp sa a Képha di: «Piske Mashiaḥ la te soufri nan lachè, nou menm tou, se pou n gen menm mantalite sa a.» Tal'mid lan dwe prepare lespri l davans pou l rete fidèl menm lè fidelite sa a lakòz opozisyon, pèt oswa soufrans. Yahushuʿah pa t kite soufrans fè L abandone volonte Papa L; se menm detèminasyon sa a tal'midim Li yo dwe genyen.\n\nMen ekspresyon «yon moun ki soufri nan lachè fini ak devyasyon» pa vle di soufrans fè yon moun vin pafè oswa rann li enkapab fè fot ankò. Kontèks vèsè 2-4 yo esplike sans lan: moun nan pran yon desizyon fèm pou l sispann viv selon dezi lèzòm pou l viv selon volonte 'Èlohim. Li pito aksepte soufri pase retounen nan ansyen fason l t ap viv la.\n\nKépha mansyone konduit tal'midim yo te kite dèyè: debòch, dezi deregle, eksè nan bwason ak idolatri. Lè ansyen konpayon yo wè yo pa kontinye kouri avèk yo nan menm chemen an, yo sezi e yo pale yo mal. Kidonk, soufrans lan se konsekans separasyon ak devyasyon an, pa yon mwayen pou achte padon.\n\nPou Membres La Voie yo, pasaj sa a poze yon kesyon trè pèsonèl: Èske mwen deja pran desizyon nan lespri mwen pou m rete fidèl menm si sa koute m yon bagay?\n\nSe sa «gen menm mantalite» ak Mashiaḥ la vle di. Yon tal'mid pa tann presyon an rive pou l deside ki bò l ap kanpe. Li pran pozisyon l davans: M ap fè volonte Yahawah, menm si lòt moun pa konprann mwen; menm si yo pase m nan rizib; menm si mwen pèdi avantaj poutèt sa.\n\n«Fini ak devyasyon» mande yon separasyon reyèl ak ansyen fason moun nan t ap viv la. Li pa vle di tal'mid la pap janm fè yon fot ankò; li vle di devyasyon pa chemen l chwazi pou l suiv ankò. Lè l tonbe, li fè teshubah epi l kontinye mache. Li pa retounen fè devyasyon tounen fason nòmal li viv.\n\nSa mande kouraj, paske pafwa obeyisans anvè Yahawah gen yon pri. Men egzanp Yahushuʿah montre nou gen bagay ki pi enpòtan pase konfò: rete fidèl devan Yahawah.", "liy_final": "Gen menm mantalite ak Mashiaḥ la vle di pran yon desizyon davans: pito soufri poutèt fidelite pase jwenn konfò nan devyasyon. Yon tal'mid konsa pa pretann li pafè; li montre devyasyon pa dirije lavi l ankò — se volonte Yahawah ki fè sa."}, {"jour": 27, "yom": "Yôm Rebi'i", "nomJou": "Yôm Rebi'i", "soir_debut": "2026-08-11", "soir_fin": "2026-08-12", "ref": "Éphésiens 1:7", "texte_kw": "« Piske Pitit li a te peye kopher la, nou libere grasa san li, wi, nou jwenn padon pou fot nou yo, selon richès favè san parèy 'Èlohim lan. »", "commentaire": "Nan kòmansman lèt li voye bay qehilah Éphèse la, Šāʾūl t ap eksplike dispozisyon Yahawah te pran atravè Yahushuʿah Ha'Mashiaḥ pou l delivre moun. Li montre dispozisyon sa a pa t fèt san yon pri: Pitit la te peye kopher la avèk pwòp san L.\n\nLide kopher la fè n sonje yon pri ki peye pou libere yon moun anba yon kondisyon kote l te prizonye oswa kondane. Depi devyasyon ak lanmò te antre nan limanite atravè Adam, tout desandan l yo vin anba konsekans sa a. Lè Yahushuʿah bay lavi pafèt Li, Li bay yon valè ki koresponn ak sa Adam te pèdi a: yon lavi imen pafè pou yon lavi imen pafè.\n\nSe poutèt sa Šāʾūl asosye twa bagay nan menm deklarasyon an: kopher la, liberasyon an ak padon fot yo. San Yahushuʿah ki te vèse a reprezante lavi L te bay kòm sakrifis. Grasa dispozisyon sa a, moun ki demontre émounah kapab jwenn padon epi libere anba kondanasyon devyasyon.\n\nMen Šāʾūl ajoute sa fèt «selon richès favè san parèy 'Èlohim lan». Kidonk, se Yahawah ki pran inisyativ la. Limanite pa t kapab pwodwi pwòp kopher pa l; Yahawah, nan lanmou L, bay sa moun pa t kapab bay pou tèt yo.\n\nPou Membres La Voie yo, pasaj sa a ede yo konprann padon gen yon pri. Lè Yahawah padone fot nou yo, sa pa vle di L fèmen je L sou devyasyon. Jistis Li mande yon baz legal pou liberasyon an, e kopher Yahushuʿah a bay baz sa a. Sa dwe fè nou pran devyasyon oserye.\n\nSi lavi Pitit Yahawah a te nesesè pou ouvri chemen padon an, nou pa kapab konsidere fot oubyen devyasyon kòm yon bagay san enpòtans. Rekonesans pou kopher la dwe pouse yon tal'mid fè teshubah, goumen kont move tandans epi chèche viv ann amoni ak volonte Yahawah.\n\nAn menm tan, moun ki fè teshubah pa bezwen rete prizonye anba kulpabilite pou yon fot Yahawah deja padone. Kopher la pa sèlman montre gravite devyasyon; li montre tou pwofondè favè Yahawah. Lè L padone sou baz san Pitit Li a, tal'mid lan kapab leve, korije chemen l epi kontinye mache devan L avèk yon konsyans netwaye.\n\nKopher la ban nou tou yon lòt rezon pou n bay lavi Yahushuʿah anpil valè. Li pa t senpleman mouri kòm yon moun ki te rete fidèl anba eprèv; Li te bay lavi L pou libere lòt moun. Se poutèt sa espwa delivrans nou, padon nou ak espwa lavi ki pap janm fini an mare ak sakrifis Li.", "liy_final": "Kopher Yahushuʿah a montre an menm tan gravite devyasyon ak grandè favè Yahawah: san Pitit Li a te peye pri liberasyon an. Se poutèt sa moun ki jwenn padon pa retounen viv anba devyasyon; l ap viv avèk rekonesans pou lavi ki te bay pou li."}, {"jour": 28, "yom": "Yôm Ḥamishi", "nomJou": "Yôm Ḥamishi", "soir_debut": "2026-08-12", "soir_fin": "2026-08-13", "ref": "1 Corinthiens 10:13", "texte_kw": "« 'Èlohim fidèl, li pap kite n tante depase sa n ka sipòte. Men, lè n jwenn tantasyon an, l ap ouvri yon chemen tou, dekwa pou n ka andire l. »", "commentaire": "Nan 1 Corinthiens chapit 10 la, akh Šāʾūl sèvi ak istwa Yisra'el nan dezè a kòm yon avètisman pou qehilah a. Pèp la te benefisye anpil nan dispozisyon Yahawah yo, men sa pa t anpeche anpil ladan yo tonbe nan idolatri, imoralite seksyèl, mete Yahawah aleprèv ak plenyen. Akh Šāʾūl esplike evènman sa yo te ekri kòm avètisman pou tal'midim yo.\n\nSe poutèt sa, jis anvan vèsè 13 la, li di: «Se pou moun ki panse l kanpe a veye pou l pa tonbe.» Yon tal'mid pa dwe janm panse l tèlman solid li pa kapab tonbe nan tantasyon.\n\nApre avètisman sa a vini yon gwo ankourajman: «'Èlohim fidèl.» Tantasyon yon moun rankontre pa yon bagay ki depase kondisyon imen an. Yahawah konnen limit ʿEbedim Li yo, e L pap abandone yo devan yon eprèv san okenn posiblite pou yo rete fidèl.\n\nMen pwomès la pa di Yahawah ap toujou retire tantasyon an. Li di L pral «ouvri yon chemen» pou moun nan kapab andire l. Chemen sa a ka mande pou yon tal'mid kouri kite yon sitiyasyon, rejte yon anvi, sonje yon prensip nan Dabar Yahawah a, chèche soutyen nan qehilah a oswa senpleman kenbe fèm jiskaske presyon an pase.\n\nKidonk, fidelite Yahawah pa vle di nou pap jwenn tantasyon; li vle di tantasyon pa oblije genyen batay la.\n\nPou Membres La Voie yo, pasaj sa a retire yon eskiz nou ka fasil bay tèt nou: «Mwen pa t kapab fè lòt jan.» Lè yon tantasyon prezante, Yahawah garanti gen yon chemen ki pèmèt nou rete fidèl. Responsablite nou se chèche chemen sa a epi pran l.\n\nPafwa chemen an se pa rete toupre tantasyon an pou teste fòs nou. Yahuseph pa t rete ap diskite ak madanm Potiphar; li kouri. Gen sitiyasyon kote pi gwo demonstrasyon fòs roḥanit lan se retire tèt nou san pèdi tan.\n\nPasaj la mande vijilans tou. Moun ki kwè l pap janm tonbe ka vin pi vilnerab pase moun ki rekonèt feblès li. Se poutèt sa yon tal'mid prepare tèt li davans: li ranpli lespri l ak Dabar Yahawah, l idantifye feblès li, l evite sitiyasyon ki kapab alimante yo epi l kontinye hitpallél pou l pa tonbe nan tantasyon.\n\nE lè batay la vin difisil, li sonje premye pawòl vèsè a: «'Èlohim fidèl.» Konfyans nou pa chita sèlman sou kapasite pa nou pou n reziste; li chita sou fidelite Yahawah, ki toujou bay yon posiblite pou n chwazi obeyisans.", "liy_final": "Tantasyon kapab mete yon tal'mid anba gwo presyon, men l pa retire kapasite l pou l chwazi. Yahawah fidèl: Li toujou kite yon chemen ouvè. Travay nou se rekonèt chemen an, pran l, epi andire jouk tantasyon an pase."}, {"jour": 29, "yom": "Ereb Shabbath", "nomJou": "Ereb Shabbath", "soir_debut": "2026-08-13", "soir_fin": "2026-08-14", "ref": "Yaʿaqob 1:14", "texte_kw": "« Chak moun pase anba eprèv lè l kite pwòp dezi l mennen l, lè l kite pwòp dezi l sedui l. »", "commentaire": "Nan kòmansman lèt li a, Yaʿaqob fè yon distenksyon enpòtan ant eprèv yon moun ka rankontre ak tantasyon pou fè sa ki mal. Li fè konnen lè yon moun anba tantasyon, li pa dwe di: «Se 'Èlohim k ap tante m.» Yahawah pa ka tante moun pou fè sa ki mal, e Li menm Li pa ka tante pa sa ki mal.\n\nYaʿaqob montre pito kote danje a kapab kòmanse: anndan moun nan menm. Li di chak moun pase anba eprèv «lè l kite pwòp dezi l mennen l, lè l kite pwòp dezi l sedui l.» Imaj la fò anpil. Dezi ki pa kòrèk la kapab tankou yon apeti ki rale yon moun oswa tankou yon pyèj ki sèvi ak yon bagay atiran pou fè viktim nan pwoche.\n\nMen Yaʿaqob pa di tout dezi pa bon. Pwoblèm lan kòmanse lè yon dezi ki pa ann amoni ak volonte Yahawah parèt, epi moun lan kite l mennen l. Vèsè ki vin apre a montre pwosesis la: dezi a, lè moun nan nouri l, vin anfante epi l pwodui devyasyon; devyasyon an, lè l fin devlope, mennen nan lanmò (Yaʿaqob 1:15).\n\nKidonk, devyasyon pa toujou kòmanse nan aksyon an. Souvan, batay la te deja kòmanse nan kè ak nan panse moun nan.\n\nPou Membres La Voie yo, pasaj sa a montre pi bon moman pou konbat tantasyon se anvan dezi a pran fòs. Yon tal'mid pa dwe tann jouk li prèske fè sa ki mal pou l kòmanse reziste. Li bezwen aprann rekonèt sa k ap pase anndan l depi nan premye etap la.\n\nSa mande onètete avèk tèt nou. Nou kapab fasil blame anviwònman nou, lòt moun oswa sikonstans nou. Men Yaʿaqob env at sou Li.\n\nKidonk, gen yon mouvman ki fèt nan toude direksyon: konesans pwodui bon travay, epi yon lavi ki aplike konesans lan pèmèt tal'mid lan kontinye grandi. Konesans ak aksyon pa dwe separe.\n\nEkspresyon «pote fwi» a montre bon travay yo dwe rezilta vizib sa k ap grandi anndan moun nan. Menm jan kalite yon pyebwa parèt nan fwi l bay, kalite relasyon yon tal'mid genyen avèk Yahawah dwe parèt nan konduit li, desizyon l, fason l trete lòt moun ak sèvis l ap rann.\n\nPou Membres La Voie yo, vèsè sa a mete devan yo de responsablite ki dwe mache ansanm: aprann epi aji. Nou pa dwe satisfè paske nou te rive konprann yon verite nou pa t konnen anvan. Nou dwe mande: Ki chanjman konesans sa a pwodui nan lavi mwen?\n\nMen akh Šāʾūl di tou: «kontinye grandi nan konesans egzat.» Sa vle di yon tal'mid pa janm rive nan yon pwen kote l kapab di: Mwen deja konnen tout sa mwen bezwen konnen. Konesans sou Yahawah mande rechèch, egzamen ak koreksyon kontinyèl.\n\nSa mande tou imilite. Lè yon egzamen serye Ketubim Qadoshim yo montre yon bagay nou te konprann anvan pa t egzak, objektif la pa dwe defann ansyen pozisyon nou an a tout pri. Nou dwe renmen laverite ase pou n korije konpreyansyon nou, san nou pa chanje sa Yahawah deja etabli klèman nan Dabar Li a.\n\nSe konsa gen yon diferans ant pwogrè nan konesans ak chanjman san fondasyon. Nou pap chèche nouvo bagay sèlman paske yo nouvo; men n ap kontinye fouye pou konpreyansyon nou vin pi egzak, toujou anba otorite Dabar Yahawah a.\n\nNan moman Shabbath la, pasaj sa a envite nou sèvi ak tan sa a pou n egzamine de kalite fwi: Èske sa m aprann sou Yahawah ap grandi? E sa mwen deja aprann yo, èske yo pwodui bon travay nan lavi m? Si toude ap grandi ansanm, konesans lan pap rete sèlman nan tèt nou — l ap vin vizib nan lavi nou.", "liy_final": "Yon tal'mid pa grandi sèlman lè l konnen plis, men lè sa l konnen sou Yahawah pwodui fwi nan lavi l. Se poutèt sa n ap kontinye aprann, kontinye verifye, kontinye korije konpreyansyon nou kote sa nesesè, epi sitou kontinye transfòme konesans egzat la an bon travay."}]}, {"mois": "Éloul", "jours": [{"jour": 1, "yom": "Yôm Rishon", "nomJou": "Yôm Rishon", "soir_debut": "2026-08-15", "soir_fin": "2026-08-16", "ref": "2 Corinthiens 2:9", "texte_kw": "« Men pou ki rezon tou mwen ekri nou: pou m ka wè si n ap montre nou obeyisan nan tout bagay. »", "commentaire": "Pawòl akh Šāʾūl yo pran tout sans yo lè n suiv avèk anpil atansyon sa k te pase nan qehilah Corinthe lan.\n\nTe gen yon sitiyasyon grav ki te mande koreksyon. Nan premye lèt li a, Šāʾūl te deja oblije entèvni avèk fèmte devan yon ka devyasyon seksyèl grav qehilah a te tolere. Li te mande asanble a pou l aji pou pwoteje pwòpte l olye l kontinye aksepte yon konduit ki te an kontradiksyon ak volonte Yahawah.\n\nQehilah a te finalman reyaji. Disiplin lan te aplike e koreksyon an te pwodui rezilta. Se nan nouvo kontèks sa a Šāʾūl ekri yo ankò. Men fwa sa a, obeyisans yo t ap teste nan yon lòt direksyon. Lè koreksyon an te deja rive nan objektif li, Šāʾūl pa t vle qehilah a kontinye pini moun nan san limit. Nan vèsè 6-8 yo, li eksplike koreksyon majorite a te bay la te sifi. Kounye a, yo te dwe padone l, konsole l epi reyafime lanmou yo pou li, pou gwo tristès pa t fini avè l.\n\nSe nan kontèks sa a li di: «Men pou ki rezon tou mwen ekri nou: pou m ka wè si n ap montre nou obeyisan nan tout bagay.» Donk, obeyisans qehilah a pa t sèlman teste lè yo te bezwen korije. Li te teste tou lè moman an te rive pou yo padone epi restore.\n\nPou Membres La Voie yo, pasaj sa a montre vrè obeyisans lan pa vle di suiv sèlman enstriksyon ki pi fasil pou n aksepte. Akh Šāʾūl pale de obeyisans «nan tout bagay».\n\nPafwa, obeyi Yahawah mande pou n pran yon pozisyon fèm kont yon devyasyon. Nou pa dwe kite santiman, relasyon pèsonèl oswa krent pou reyaksyon lòt moun fè n tolere sa Dabar Yahawah a kondane.\n\nMen gen yon lòt bò ki egalman enpòtan: lè moun ki te fè fot la fè teshubah epi koreksyon an rive nan objektif li, obeyisans mande pou nou chanje atitid nou anvè l. Nou pa dwe kontinye fè moun nan peye pou yon fot Yahawah dispoze ou deja padone. Nou pa dwe sèvi ak pase l kòm yon etikèt pèmanan. Nou pa dwe fè disiplin tounen revanj. Okontrè, nou dwe ede moun lan leve ankò.\n\nSa montre objektif disiplin lan se pa kraze yon moun; se mennen l nan teshubah epi jwenn li ankò. Lè objektif sa a reyalize, lanmou mande restorasyon. Gen yon leson enpòtan tou pou qehilah a: fèmte ak mizèrikòd pa opoze youn ak lòt. Toude kapab soti nan obeyisans. Gen yon moman pou korije avèk fèmte; gen yon moman pou n ouvri bra nou pou moun ki fè teshubah.\n\nVrè matirite se konnen diferans lan. Kidonk, chak tal'mid kapab mande tèt li: Èske m obeyisan sèlman lè enstriksyon Yahawah a konfòm ak santiman m, oswa èske m dispoze korije lè sa nesesè epi padone lè teshubah fèt? Se la obeyisans lan vin konplè.", "liy_final": "Obeyisans pa sèlman konnen kilè pou n fèm; li mande tou pou n konnen kilè pou n padone. Lè teshubah fèt, objektif la pa kontinye pini moun lan, men restore l. Se konsa qehilah a montre l obeyisan «nan tout bagay»."}]}];

  }

  // Liy final
  if(jounen.liy_final) slides.push({type:'liy_final',badge,texte:jounen.liy_final});
} else {
  slides.push({type:'verset',badge:'La Voie',texte:'Tèks pou jounen an ap vini...',ref:''});
}

function rendSlide(idx){
  const wrap=document.getElementById('slides-wrap');
  const s=slides[idx];
  let html='';
  if(s.type==='illus'){
    html=`<div class="slide-illus"><img src="${s.src}" alt="Illustration ${s.badge}"/></div>`;
  } else if(s.type==='verset'){
    html=`<div class="badge-jou">${s.badge}</div><div class="sep"></div><div class="verset">${s.texte}</div>${s.ref?`<div class="ref">— ${s.ref}</div>`:''}<div class="ornement">✦</div>`;
  } else if(s.type==='commentaire'){
    html=`<div class="badge-jou">${s.badge} · ${s.num}/${s.total}</div><div class="sep"></div><div class="commentaire">${s.texte}</div>`;
  } else if(s.type==='liy_final'){
    html=`<div class="badge-jou">${s.badge}</div><div class="sep"></div><div class="liy-final">${s.texte}</div><div class="ornement">✦ ✦ ✦</div>`;
  }
  const old=wrap.querySelector('.slide.actif');
  if(old){old.classList.remove('actif');old.classList.add('sortant');setTimeout(()=>old.remove(),900);}
  const div=document.createElement('div');div.className='slide actif';div.innerHTML=html;wrap.appendChild(div);
  const pct=((idx+1)/slides.length)*100;
  document.getElementById('barre-prog').style.width=pct+'%';
  document.getElementById('indicateur').textContent=`${idx+1} / ${slides.length}`;
  document.getElementById('btn-prev').disabled=(idx===0);
  document.getElementById('btn-next').disabled=(idx===slides.length-1);
}

function naviguer(dir){const nv=idxActif+dir;if(nv<0||nv>=slides.length)return;idxActif=nv;rendSlide(idxActif);}

const audio=document.getElementById('audio');
let muzikOn=false;
function toggleMuzik(){if(muzikOn){audio.pause();muzikOn=false;document.getElementById('btn-muzik').textContent='🎵';}else{audio.play().catch(e=>console.log(e));muzikOn=true;if(audio.volume<0.01)audio.volume=0.12;document.getElementById('btn-muzik').textContent='🔇';}}

let vwaOn=false;
function toggleVwa(){
  const av=document.getElementById('audio-vwa');
  const btn=document.getElementById('btn-vwa');
  if(vwaOn){av.pause();vwaOn=false;btn.textContent='🎙';}
  else{av.play().catch(e=>console.log(e));vwaOn=true;btn.textContent='⏸';}
}

// Lè vwa a fini — montre bouton play ankò
document.getElementById('audio-vwa').addEventListener('ended',()=>{
  if(vwaAvanse()) return;
  document.getElementById('btn-vwa').textContent='🎙';
  vwaOn=false;
});

function demarrer(){
  const ec=document.getElementById('ecran-accueil');
  ec.classList.add('cache');setTimeout(()=>ec.remove(),1300);
  // Muzik background — volume ba (0.25)
  audio.volume=0;
  audio.play().catch(e=>console.log(e));muzikOn=true;
  document.getElementById('btn-muzik').textContent='🔇';
  /* Si gen yon prelid, enstrimantal la rete an silans pandan l ap jwe —
     li monte lè vwa tèks la kòmanse (gade vwaAvanse). Sinon li monte touswit. */
  if(!(VWA_LIS.length > 1)) muzikMonte();
  // Vwa — kòmanse apre 1.5s
  // Vwa — kòmanse apre 1.5s sèlman si li deja chaje
  const av=document.getElementById('audio-vwa');
  if(av.src && av.src!==window.location.href){
    av.load();
    // Lè vwa fini — remonte mizik background la
    av.addEventListener('ended', ()=>{
      if(vwaAvanse()) return;
      vwaOn=false;
      document.getElementById('btn-vwa').textContent='🎙';
      if(muzikOn){ let v=audio.volume; const fi=setInterval(()=>{v=Math.min(0.12,v+0.003);audio.volume=v;if(v>=0.12)clearInterval(fi);},100); }
    });
    setTimeout(()=>{
      av.play().then(()=>{
        vwaOn=true;
        document.getElementById('btn-vwa').textContent='⏸';
      }).catch(e=>console.log('Vwa:', e));
    }, 1800);
  }
  rendSlide(0);
}
</script>
