<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tèks pou Jounen an — La Voie</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bleu-nuit:#0d2347;--or:#c9a84c;--or-pale:#e8d08a;--parchemin:#f5f0e8;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bleu-nuit);font-family:'Cormorant Garamond',Georgia,serif;color:var(--parchemin);}
#ecran-accueil{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1a3a6b 0%,#0d2347 60%,#060f1e 100%);transition:opacity 1.2s ease;}
#ecran-accueil.cache{opacity:0;pointer-events:none;}
.accueil-menorah{font-size:clamp(2.5rem,8vw,4.5rem);margin-bottom:1.5rem;}
.accueil-titre{font-family:'Cinzel',serif;font-size:clamp(1.2rem,4vw,2rem);color:var(--or);letter-spacing:0.2em;text-align:center;margin-bottom:0.5rem;}
.accueil-sous{font-size:clamp(0.9rem,2.5vw,1.1rem);color:var(--or-pale);letter-spacing:0.1em;text-align:center;margin-bottom:3rem;font-style:italic;opacity:0.8;}
.accueil-btn{padding:1rem 2.5rem;border:1px solid var(--or);border-radius:999px;background:rgba(201,168,76,0.1);color:var(--or-pale);font-family:'Cinzel',serif;font-size:clamp(0.85rem,2.5vw,1rem);letter-spacing:0.15em;cursor:pointer;transition:all 0.3s;animation:puls 2.2s ease-in-out infinite;}
.accueil-btn:hover{background:rgba(201,168,76,0.25);}
@keyframes puls{50%{box-shadow:0 0 22px rgba(201,168,76,0.4);}}
#scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a3a6b 0%,#0d2347 55%,#060f1e 100%);overflow:hidden;}
.etoile{position:absolute;border-radius:50%;background:rgba(232,208,138,0.7);animation:scintille ease-in-out infinite;}
@keyframes scintille{0%,100%{opacity:0.15;transform:scale(0.8);}50%{opacity:0.9;transform:scale(1.3);}}
.ligne-or{position:absolute;top:0;left:50%;transform:translateX(-50%);width:1px;height:100%;background:linear-gradient(to bottom,transparent,rgba(201,168,76,0.12),transparent);pointer-events:none;}
#slides-wrap{position:relative;z-index:10;width:min(780px,92vw);text-align:center;padding:2rem 1.5rem;}
.slide{display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;opacity:0;animation:slideIn 1.4s ease forwards;}
.slide.actif{display:flex;}
@keyframes slideIn{0%{opacity:0;transform:translateY(28px);}100%{opacity:1;transform:translateY(0);}}
@keyframes slideOut{0%{opacity:1;}100%{opacity:0;transform:translateY(-24px);}}
.slide.sortant{animation:slideOut 0.9s ease forwards;}
.badge-jou{font-family:'Cinzel',serif;font-size:clamp(0.65rem,2vw,0.8rem);letter-spacing:0.22em;color:var(--or);border:1px solid rgba(201,168,76,0.4);border-radius:999px;padding:0.35rem 1.1rem;background:rgba(201,168,76,0.08);text-transform:uppercase;}
.sep{width:60px;height:1px;background:linear-gradient(to right,transparent,var(--or),transparent);}
.verset{font-size:clamp(1.15rem,3.5vw,1.65rem);font-style:italic;line-height:1.65;color:var(--parchemin);max-width:680px;text-shadow:0 2px 12px rgba(0,0,0,0.5);}
.ref{font-family:'Cinzel',serif;font-size:clamp(0.7rem,2vw,0.85rem);letter-spacing:0.18em;color:var(--or-pale);opacity:0.85;}
.ornement{font-size:1.2rem;color:var(--or);opacity:0.6;}
.commentaire{font-size:clamp(0.88rem,2.5vw,1.05rem);line-height:1.85;color:rgba(245,240,232,0.88);max-width:680px;text-align:justify;hyphens:auto;border-left:2px solid rgba(201,168,76,0.35);padding-left:1.2rem;}
.liy-final{font-size:clamp(0.9rem,2.5vw,1.08rem);font-style:italic;color:var(--or-pale);max-width:620px;line-height:1.6;padding:1rem 1.5rem;border:1px solid rgba(201,168,76,0.3);border-radius:8px;background:rgba(201,168,76,0.06);}
.liy-final::before{content:"💎 ";}
#nav-bas{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:1rem;padding:1.2rem 1rem 1.8rem;background:linear-gradient(to top,rgba(6,15,30,0.95),transparent);}
.btn-nav{width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,168,76,0.5);background:rgba(13,35,71,0.8);color:var(--or-pale);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.25s;}
.btn-nav:hover{background:rgba(201,168,76,0.2);border-color:var(--or);}
.btn-nav:disabled{opacity:0.25;cursor:default;}
#indicateur{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.15em;color:var(--or-pale);opacity:0.7;min-width:60px;text-align:center;}
#btn-muzik{position:fixed;bottom:1.5rem;right:1.2rem;z-index:30;width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,168,76,0.45);background:rgba(13,35,71,0.85);color:var(--or-pale);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;}
#barre-prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(to right,var(--or),var(--or-pale));transition:width 0.6s ease;z-index:30;}
@media(max-width:600px){.commentaire{text-align:left;}#slides-wrap{padding:1.2rem 1rem;}}

.slide-illus img {
  width: min(420px, 88vw);
  border-radius: 12px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,168,76,0.3);
  animation: slideIn 1.4s ease forwards;
}
</style>
</head>
<body>
<audio id="audio" loop preload="auto"><source src="teks-jounen-muzik.mp3" type="audio/mpeg"></audio>
<div id="ecran-accueil">
  <div class="accueil-menorah">🕎</div>
  <div class="accueil-titre">TÈKS POU JOUNEN AN</div>
  <div class="accueil-sous">Les Membres de La Voie · lavoie.world</div>
  <button class="accueil-btn" onclick="demarrer()">✦ Antre nan meditasyon an ✦</button>
</div>
<div id="scene">
  <div class="ligne-or"></div>
  <div id="barre-prog" style="width:0%"></div>
  <div id="slides-wrap"></div>
</div>
<div id="nav-bas">
  <button class="btn-nav" id="btn-prev" onclick="naviguer(-1)" disabled>‹</button>
  <span id="indicateur">1 / 1</span>
  <button class="btn-nav" id="btn-next" onclick="naviguer(1)">›</button>
</div>
<button id="btn-muzik" onclick="toggleMuzik()">🎵</button>
<script>
// Etoiles
const scene=document.getElementById('scene');
for(let i=0;i<55;i++){const e=document.createElement('div');e.className='etoile';const sz=Math.random()*2.5+0.8;e.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-duration:${2.5+Math.random()*4}s;animation-delay:${Math.random()*5}s`;scene.appendChild(e);}

// Données tès — jou 5 Rebi'i
const jounen = {
  jour: 5,
  mois: "Rebi'i",
  nomJou: "Yôm Rishon",
  ref: "Yaʿaqob 1:5",
  texte_kw: "« Si youn nan nou manke bon konprann, se pou l kontinye mande 'Èlohim li, e l ap ba li l, paske l donan ak tout moun, e li pa fè repwòch. »",
  commentaire: "Nan kòmansman lèt li a, Yaʿaqob ap ankouraje tal'midim yo pou yo kenbe fèm lè yo rankontre divès kalite eprèv. Li montre eprèv yo kapab ede yon moun devlope andirans ak matirite. Men, pou fè fas ak sitiyasyon sa yo yon fason ki fè Yahawah plezi, yon moun bezwen bon konprann.\n\nSe nan kontèks sa a Yaʿaqob di: \"Si youn nan nou manke bon konprann, se pou l kontinye mande 'Èlohim li.\" Bon konprann li pale a pa limite ak konesans oswa entèlijans. Li se kapasite pou konprann volonte Yahawah epi aplike Dabar Li a avèk bon jijman nan sitiyasyon lavi yo.\n\nYaʿaqob mete aksan sou jenewozite Yahawah. Li pa dekouraje moun ki pwoche bò kote Li avèk senserite; okontrè, Li dispoze bay direksyon ak bon konprann san Li pa fè repwòch moun ki mande avèk yon kè sensè.\n\nPou Les Membres de La Voie yo, pasaj sa a raple yo pa gen okenn wont pou rekonèt limit pa yo epi chèche direksyon Yahawah. Chak jou pote desizyon, defi ak eprèv ki mande plis pase eksperyans lèzòm; yo mande bon konprann ki soti nan Yahawah.\n\nLè yon tal'mid ap fè fas ak yon chwa enpòtan, yon pwoblèm fanmi, yon desizyon nan qehilah a oswa yon eprèv pèsonèl, li pa dwe konte sèlman sou pwòp refleksyon pa li. Li dwe hitpallél, etidye Ketubim Qadoshim yo epi chèche konprann prensip Yahawah yo pou l ka pran desizyon ki ann amoni ak volonte Li.\n\nPasaj sa a ankouraje Les Membres de La Voie yo tou pou yo gen konfyans nan jenerozite Yahawah. Lè yo mande Li bon konprann avèk émounah ak yon kè ki dispoze obeyi, yo kapab gen asirans Li ap gide yo atravè Dabar Li a epi ede yo mache sou bon chemen an.",
  liy_final: "Vrè bon konprann pa soti nan kapasite lèzòm sèlman; li soti nan Yahawah e Li bay li avèk jenerozite bay moun ki chèche Li avèk yon kè sensè."
};

const badge = `${jounen.nomJou} · ${jounen.jour} ${jounen.mois}`;
let slides = [];
// Slide 0 — Illustration
slides.push({type:'illus', badge, src:'teks-jounen-illus-4-rebi.jpg'});
slides.push({type:'verset', badge, texte:jounen.texte_kw, ref:jounen.ref});
const parag = jounen.commentaire.split('\n\n').filter(p=>p.trim());
parag.forEach((p,i)=>slides.push({type:'commentaire', badge, texte:p.trim(), num:i+1, total:parag.length}));
slides.push({type:'liy_final', badge, texte:jounen.liy_final});

let idxActif=0;

function rendSlide(idx){
  const wrap=document.getElementById('slides-wrap');
  const s=slides[idx];
  let html='';
  if(s.type==='illus'){html=`<div class="slide-illus"><img src="${s.src}" alt="Illustration"/></div>`;}
  else if(s.type==='verset'){html=`<div class="badge-jou">${s.badge}</div><div class="sep"></div><div class="verset">${s.texte}</div>${s.ref?`<div class="ref">— ${s.ref}</div>`:''}<div class="ornement">✦</div>`;}
  else if(s.type==='commentaire'){html=`<div class="badge-jou">${s.badge} · ${s.num}/${s.total}</div><div class="sep"></div><div class="commentaire">${s.texte}</div>`;}
  else if(s.type==='liy_final'){html=`<div class="badge-jou">${s.badge}</div><div class="sep"></div><div class="liy-final">${s.texte}</div><div class="ornement">✦ ✦ ✦</div>`;}
  const old=wrap.querySelector('.slide.actif');
  if(old){old.classList.remove('actif');old.classList.add('sortant');setTimeout(()=>old.remove(),900);}
  const div=document.createElement('div');div.className='slide actif';div.innerHTML=html;wrap.appendChild(div);
  const pct=((idx+1)/slides.length)*100;
  document.getElementById('barre-prog').style.width=pct+'%';
  document.getElementById('indicateur').textContent=`${idx+1} / ${slides.length}`;
  document.getElementById('btn-prev').disabled=(idx===0);
  document.getElementById('btn-next').disabled=(idx===slides.length-1);
}

function naviguer(dir){const nv=idxActif+dir;if(nv<0||nv>=slides.length)return;idxActif=nv;rendSlide(idxActif);}

const audio=document.getElementById('audio');
let muzikOn=false;
function toggleMuzik(){if(muzikOn){audio.pause();muzikOn=false;document.getElementById('btn-muzik').textContent='🎵';}else{audio.play().catch(e=>console.log(e));muzikOn=true;document.getElementById('btn-muzik').textContent='🔇';}}

function demarrer(){
  const ec=document.getElementById('ecran-accueil');
  ec.classList.add('cache');setTimeout(()=>ec.remove(),1300);
  audio.volume=0;audio.play().catch(e=>console.log(e));muzikOn=true;
  document.getElementById('btn-muzik').textContent='🔇';
  let v=0;const fi=setInterval(()=>{v=Math.min(1,v+0.03);audio.volume=v;if(v>=1)clearInterval(fi);},200);
  rendSlide(0);
}
</script>
</body>
</html>
