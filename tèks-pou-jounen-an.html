<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tèks pou Jounen an · La Voie</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--or:#c9a84c;--or-clair:#e8cb7a;--or-pale:#f7edcc;--bleu:#060d1a;--bleu2:#0d2347;--argent:#b8c8dc}
html{scroll-behavior:smooth}
body{font-family:'EB Garamond',serif;background:#060d1a;color:#e8f0f8;overflow-x:hidden;padding-bottom:80px}

/* TOP BAR */
#top-bar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(6,13,26,0.97);
  border-bottom:1px solid rgba(201,168,76,0.2);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;z-index:500;backdrop-filter:blur(8px);
}
.back-btn{
  display:flex;align-items:center;gap:0.4rem;
  font-family:'Cinzel',serif;font-size:0.6rem;
  letter-spacing:0.12em;color:var(--or);
  text-decoration:none;text-transform:uppercase;
  opacity:0.8;transition:opacity 0.2s;padding:0.4rem 0;
}
.back-btn:hover{opacity:1}
.back-btn svg{width:16px;height:16px}

.lang-btn{
  display:flex;align-items:center;gap:0.3rem;
  font-family:'Cinzel',serif;font-size:0.55rem;
  letter-spacing:0.12em;color:var(--or);
  border:1px solid rgba(201,168,76,0.35);
  background:transparent;cursor:pointer;
  padding:0.3rem 0.7rem;transition:all 0.2s;
  text-transform:uppercase;
}
.lang-btn:hover{background:rgba(201,168,76,0.1)}
.lang-btn svg{width:14px;height:14px}

/* SLIDE-IN ANIMATION */
.page-slide-in{
  animation:slideIn 0.35s ease-out;
}
@keyframes slideIn{
  from{transform:translateX(100vw);opacity:0}
  to{transform:translateX(0);opacity:1}
}

/* MAIN */
main{padding-top:52px}

/* DATE SECTION */
.date-section{
  padding:2rem 1.4rem 1.5rem;
  text-align:center;
  background:linear-gradient(180deg,rgba(13,35,71,0.95) 0%,rgba(6,13,26,0.98) 100%);
  border-bottom:1px solid rgba(201,168,76,0.12);
}
.date-label{
  font-family:'Cinzel',serif;font-size:0.52rem;
  letter-spacing:0.3em;color:var(--or);
  text-transform:uppercase;opacity:0.65;margin-bottom:0.5rem;
}
.date-ibri{
  font-family:'Cinzel',serif;font-size:1.5rem;
  color:var(--or-clair);letter-spacing:0.1em;margin-bottom:0.2rem;
}
.date-yom{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:0.88rem;color:var(--argent);opacity:0.6;margin-bottom:0.2rem;
}
.date-greg{
  font-size:0.75rem;color:var(--argent);opacity:0.5;font-style:italic;
}
.date-line{width:60px;height:1px;background:linear-gradient(to right,transparent,var(--or),transparent);margin:0.8rem auto 0}

/* TÈKS CARD */
.teks-card{
  background:linear-gradient(135deg,rgba(13,35,71,0.6),rgba(6,13,26,0.8));
  border:1px solid rgba(201,168,76,0.25);border-top:3px solid var(--or);
  margin:1.5rem 1.2rem;padding:1.8rem 1.4rem;position:relative;
}
.teks-ref{
  font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.25em;
  color:var(--or);text-transform:uppercase;margin-bottom:1.2rem;
  text-align:center;opacity:0.85;
}
.teks-texte{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(1.1rem,2.5vw,1.35rem);line-height:1.8;
  color:var(--or-pale);text-align:center;
}

/* ORNEMENT */
.ornement{text-align:center;color:var(--or);font-size:0.6rem;letter-spacing:0.5em;opacity:0.3;margin:1.5rem 0}

/* COMMENTAIRE */
.commentaire-card{
  background:rgba(13,35,71,0.35);
  border:1px solid rgba(201,168,76,0.12);
  border-left:3px solid var(--or);
  margin:0 1.2rem 1.5rem;padding:1.4rem 1.4rem;
}
.commentaire-titre{
  font-family:'Cinzel',serif;font-size:0.58rem;
  letter-spacing:0.22em;color:var(--or);
  text-transform:uppercase;margin-bottom:0.6rem;
}
.commentaire-auteur{
  font-family:'Cinzel',serif;font-size:0.52rem;
  letter-spacing:0.15em;color:var(--or);opacity:0.55;
  margin-bottom:0.9rem;text-transform:uppercase;
}
.commentaire-texte{
  font-size:1rem;line-height:1.88;
  color:#e8f0f8;opacity:0.85;
}
.commentaire-texte p{margin-bottom:0.9rem}
.commentaire-texte p:last-child{margin-bottom:0}

/* LIY FINAL */
.liy-final{
  background:linear-gradient(135deg,rgba(201,168,76,0.08),rgba(13,35,71,0.4));
  border:1px solid rgba(201,168,76,0.2);
  margin:0 1.2rem 2rem;padding:1.2rem 1.4rem;text-align:center;
}
.liy-final-label{
  font-family:'Cinzel',serif;font-size:0.5rem;
  letter-spacing:0.25em;color:var(--or);text-transform:uppercase;
  opacity:0.6;margin-bottom:0.5rem;
}
.liy-final-texte{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.05rem;line-height:1.7;color:var(--or-pale);
}

/* LANG OVERLAY */
#lang-overlay{
  display:none;position:fixed;inset:0;z-index:800;
  background:rgba(6,13,26,0.85);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;
}
#lang-overlay.open{display:flex}
.lang-panel{
  background:rgba(13,35,71,0.95);
  border:1px solid rgba(201,168,76,0.3);
  border-radius:4px;padding:1.8rem;
  display:flex;flex-direction:column;gap:0.8rem;
  min-width:220px;
}
.lang-panel p{
  font-family:'Cinzel',serif;font-size:0.58rem;
  letter-spacing:0.25em;color:var(--or);
  text-transform:uppercase;opacity:0.7;margin-bottom:0.4rem;
}
.lang-opt{
  display:flex;align-items:center;gap:0.8rem;
  background:rgba(13,35,71,0.5);border:1px solid rgba(201,168,76,0.15);
  padding:0.7rem 1rem;cursor:pointer;transition:all 0.2s;
  color:var(--or-pale);font-size:1rem;
}
.lang-opt:hover,.lang-opt.active{background:rgba(201,168,76,0.12);border-color:rgba(201,168,76,0.4)}
.lang-opt .flag{font-size:1.3rem}
.lang-opt .nom{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.08em}
</style>
</head>
<body class="page-slide-in">

<!-- TOP BAR -->
<div id="top-bar">
  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
    Accueil
  </a>

  <button class="lang-btn" onclick="toggleLang()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span id="lang-label">KW</span>
  </button>
</div>

<main>
  <!-- DATE -->
  <div class="date-section">
    <p class="date-label">✦ Tèks pou Jounen an · Dabar Ha'Yom</p>
    <p class="date-ibri" id="pg-dat">...</p>
    <p class="date-yom" id="pg-yom"></p>
    <p class="date-greg" id="pg-greg"></p>
    <div class="date-line"></div>
  </div>

  <!-- TÈKS -->
  <div class="teks-card">
    <p class="teks-ref" id="pg-ref">...</p>
    <p class="teks-texte" id="pg-texte"></p>
  </div>

  <div class="ornement">✦ &nbsp; ✦ &nbsp; ✦</div>

  <!-- KÒMANTÈ -->
  <div class="commentaire-card">
    <p class="commentaire-titre">✦ Kontèks ak Meditasyon</p>
    <p class="commentaire-auteur">— B'neiYah · Les Membres de La Voie</p>
    <div class="commentaire-texte" id="pg-commentaire"></div>
  </div>

  <!-- LIY FINAL -->
  <div class="liy-final" id="pg-liy-wrap" style="display:none">
    <p class="liy-final-label">💎 Liy final</p>
    <p class="liy-final-texte" id="pg-liy"></p>
  </div>

</main>

<!-- LANG OVERLAY -->
<div id="lang-overlay" onclick="closeLang()">
  <div class="lang-panel" onclick="event.stopPropagation()">
    <p>✦ Chwazi lang</p>
    <div class="lang-opt active" id="opt-kw" onclick="setLang('kw')">
      <span class="flag">🇭🇹</span>
      <span class="nom">Kreyòl Ayisyen</span>
    </div>
    <div class="lang-opt" id="opt-fr" onclick="setLang('fr')">
      <span class="flag">🇫🇷</span>
      <span class="nom">Français</span>
    </div>
  </div>
</div>

<script>
const MOIS_NOM = {
  '01':'janvye','02':'fevriye','03':'mas','04':'avril',
  '05':'me','06':'jen','07':'jiyè','08':'out',
  '09':'septanm','10':'oktòb','11':'novanm','12':'desanm'
};

let currentLang = localStorage.getItem('lv-lang') || 'kw';
let currentJounen = null;

function getJourSiban() {
  const now = new Date();
  const indyStr = now.toLocaleString('en-US', {timeZone: 'America/Indiana/Indianapolis'});
  const indy = new Date(indyStr);
  const leHeure = indy.getHours() + indy.getMinutes() / 60;
  const apres_soleil = leHeure >= 20.5;
  const annee = indy.getFullYear();
  const mois = String(indy.getMonth() + 1).padStart(2, '0');
  const jou = String(indy.getDate()).padStart(2, '0');
  return { datGreg: annee + '-' + mois + '-' + jou, apres_soleil };
}

function renderJounen(jounen, data) {
  const lang = currentLang;
  document.getElementById('pg-dat').textContent = jounen.jour + ' ' + data.mois + ' ' + data.annee;
  document.getElementById('pg-ref').textContent = jounen.ref;

  // Texte selon lang
  const texte = (lang === 'fr' && jounen.texte) ? jounen.texte : (jounen.texte_kw || jounen.texte);
  document.getElementById('pg-texte').textContent = texte;

  // Yom (nom jou)
  const yomMap = {
    'Yôm Rishon':'Dimanch','Yôm Shéni':'Lendi','Yôm Shlishi':'Madi',
    'Yôm Rebi\'i':'Mèkredi','Yôm Hamishi':'Jedi','Yôm HaHakhana':'Vandredi','Shabbat':'Shabbat'
  };
  // Try to get yom from field if present
  if (jounen.yom) document.getElementById('pg-yom').textContent = jounen.yom;
  else document.getElementById('pg-yom').textContent = '';

  // Greg
  const [an1, m1, d1] = jounen.soir_debut.split('-');
  const [an2, m2, d2] = jounen.soir_fin.split('-');
  document.getElementById('pg-greg').textContent =
    'Swa ' + parseInt(d1) + ' ' + MOIS_NOM[m1] + ' → Swa ' + parseInt(d2) + ' ' + MOIS_NOM[m2] + ' ' + an2;

  // Kòmantè
  const comm = jounen.commentaire || '';
  const paras = comm.split('\n\n').filter(p => p.trim());
  const commDiv = document.getElementById('pg-commentaire');
  commDiv.innerHTML = paras.map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');

  // Liy final
  if (jounen.liy_final) {
    document.getElementById('pg-liy').textContent = jounen.liy_final;
    document.getElementById('pg-liy-wrap').style.display = 'block';
  }

  // Lang button
  document.getElementById('lang-label').textContent = lang === 'fr' ? 'FR' : 'KW';
  document.getElementById('opt-kw').classList.toggle('active', lang === 'kw');
  document.getElementById('opt-fr').classList.toggle('active', lang === 'fr');
}

fetch('teks-jounen.json')
  .then(r => r.json())
  .then(data => {
    const { datGreg, apres_soleil } = getJourSiban();
    let jounen = null;
    for (let i = 0; i < data.jours.length; i++) {
      const j = data.jours[i];
      if (j.soir_debut === datGreg && apres_soleil) { jounen = j; break; }
      if (j.soir_fin === datGreg && !apres_soleil) { jounen = j; break; }
    }
    if (!jounen) jounen = data.jours[16]; // fallback 17 Siban
    currentJounen = { jounen, data };
    renderJounen(jounen, data);
  })
  .catch(() => {
    document.getElementById('pg-dat').textContent = '17 Siban 5786';
    document.getElementById('pg-ref').textContent = 'Mattiyahu 12:41';
    document.getElementById('pg-texte').textContent = '« Moun Ninbeh yo ap leve nan jijman ansanm ak jenerasyon sa a. »';
  });

function toggleLang() {
  document.getElementById('lang-overlay').classList.add('open');
}
function closeLang() {
  document.getElementById('lang-overlay').classList.remove('open');
}
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lv-lang', lang);
  closeLang();
  if (currentJounen) renderJounen(currentJounen.jounen, currentJounen.data);
}
</script>
</body>
</html>
