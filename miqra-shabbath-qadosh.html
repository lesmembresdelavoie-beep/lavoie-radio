<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miqra Qadosh — Shabbath</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  :root{--bleu-nuit:#0d2347;--or:#c9a84c;--or-clair:#e8c96a;--parchemin:#f5efe0}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bleu-nuit);color:var(--parchemin);font-family:'EB Garamond',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}
  .container{max-width:480px;width:100%;text-align:center}
  .sep{color:var(--or);font-size:1.2rem;letter-spacing:.3em;margin-bottom:.5rem;font-family:'Cinzel',serif}
  h1{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:700;color:var(--or);letter-spacing:.05em;margin-bottom:.3rem}
  .subtitle{font-style:italic;color:var(--or-clair);font-size:1rem;margin-bottom:2.5rem;opacity:.85}
  .player-card{background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.25);border-radius:16px;padding:2rem 1.5rem;margin-bottom:1.5rem}
  .track-number{font-family:'Cinzel',serif;font-size:.75rem;color:var(--or);opacity:.6;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.5rem}
  .track-name{font-size:1.15rem;color:var(--parchemin);line-height:1.4;min-height:2.5em;margin-bottom:1.5rem;padding:0 .5rem}
  .progress-wrap{background:rgba(255,255,255,.1);border-radius:99px;height:4px;margin-bottom:.5rem;cursor:pointer}
  .progress-bar{background:var(--or);height:100%;border-radius:99px;width:0%;transition:width .5s linear;pointer-events:none}
  .time-display{font-size:.8rem;opacity:.5;display:flex;justify-content:space-between;margin-bottom:1.5rem}
  .controls{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-bottom:1.5rem}
  .btn-skip{background:none;border:none;color:var(--parchemin);opacity:.6;cursor:pointer;font-size:1.4rem;padding:.5rem;transition:opacity .2s}
  .btn-skip:hover{opacity:1}.btn-skip:disabled{opacity:.2;cursor:default}
  .btn-play{width:72px;height:72px;border-radius:50%;background:var(--or);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s;box-shadow:0 4px 20px rgba(201,168,76,.35)}
  .btn-play:hover{background:var(--or-clair);transform:scale(1.05)}.btn-play:active{transform:scale(.97)}
  .play-icon{color:var(--bleu-nuit);font-size:2rem;padding-left:3px}
  .playlist-title{font-family:'Cinzel',serif;font-size:.7rem;color:var(--or);letter-spacing:.2em;opacity:.6;text-transform:uppercase;margin-bottom:.8rem;text-align:center}
  .track-item{display:flex;align-items:center;gap:.75rem;padding:.45rem .5rem;border-radius:8px;cursor:pointer;transition:background .15s;font-size:.88rem;color:rgba(245,239,224,.55);text-align:left}
  .track-item:hover{background:rgba(255,255,255,.05);color:var(--parchemin)}
  .track-item.active{background:rgba(201,168,76,.12);color:var(--or-clair)}
  .track-item.played{color:rgba(245,239,224,.3)}
  .track-dot{width:6px;height:6px;border-radius:50%;background:rgba(201,168,76,.3);flex-shrink:0}
  .track-item.active .track-dot{background:var(--or)}
  .footer-note{margin-top:2rem;font-size:.78rem;opacity:.35;font-style:italic}
  /* Écran de démarrage */
  .splash{position:fixed;inset:0;background:var(--bleu-nuit);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
  .splash-sep{color:var(--or);font-family:'Cinzel',serif;font-size:1.2rem;letter-spacing:.3em;margin-bottom:1rem}
  .splash h2{font-family:'Cinzel',serif;font-size:1.8rem;color:var(--or);margin-bottom:.3rem}
  .splash-sub{font-style:italic;color:rgba(232,201,106,.75);margin-bottom:.5rem;font-family:'EB Garamond',serif}
  .splash-date{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.2em;color:var(--or);opacity:.5;text-transform:uppercase;margin-bottom:1.5rem}
  .splash-line{width:60px;height:1px;background:var(--or);opacity:.3;margin:0 auto 2rem}
  .btn-entrer{background:var(--or);color:var(--bleu-nuit);font-family:'Cinzel',serif;font-size:1rem;font-weight:700;letter-spacing:.15em;border:none;border-radius:99px;padding:1rem 2.5rem;cursor:pointer;transition:transform .15s,background .2s;box-shadow:0 4px 24px rgba(201,168,76,.4)}
  .btn-entrer:hover{background:#e8c96a;transform:scale(1.04)}
  .btn-entrer:active{transform:scale(.97)}
  .splash-note{margin-top:1.5rem;font-size:.75rem;opacity:.35;font-style:italic;font-family:'EB Garamond',serif}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-sep">✦ ✦ ✦</div>
  <h2>Miqra Qadosh</h2>
  <div class="splash-sub">Shabbath — Service d'ʿAbodah</div>
  <div class="splash-date">18 Rebi'i · Les Membres de La Voie</div>
  <div class="splash-line"></div>
  <button class="btn-entrer" onclick="entrerAbodah()">▶ &nbsp;Antre nan ʿAbodah</button>
  <div class="splash-note">Le service complet jouera automatiquement</div>
</div>
<div class="container">
  <div class="sep">✦ ✦ ✦</div>
  <h1>Miqra Qadosh</h1>
  <div class="subtitle">Shabbath — Service d'ʿAbodah</div>
  <div class="player-card">
    <div class="track-number" id="trackNum">— / 19</div>
    <div class="track-name" id="trackName">Appuyez sur ▶ pour commencer le service</div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="time-display"><span id="timeCurrent">0:00</span><span id="timeTotal">0:00</span></div>
    <div class="controls">
      <button class="btn-skip" id="btnPrev" onclick="prevTrack()" disabled>&#9664;&#9664;</button>
      <button class="btn-play" id="btnPlay" onclick="togglePlay()"><span class="play-icon" id="playIcon">&#9654;</span></button>
      <button class="btn-skip" id="btnNext" onclick="nextTrack()">&#9654;&#9654;</button>
    </div>
  </div>
  <div><div class="playlist-title">Programme du service</div><div id="playlist"></div></div>
  <div class="footer-note">Les Membres de La Voie — lavoie.world</div>
</div>
<audio id="audioPlayer" preload="auto"></audio>
<script>
const tracks=[
  {name:"Propos d'ouverture du Shabbath",src:"audio/shabbath/01_Propos_d_ouverture_du_Shabbat.mp3"},
  {name:"An rasanble ansanm",src:"audio/shabbath/02_An_rasanble_ansanm.mp3"},
  {name:"Remerciement pour le Chirat Tehillah d'ouverture",src:"audio/shabbath/03_Remerciement_Chirat_Tehillah_ouverture.mp3"},
  {name:"Téfilah d'ouverture du Shabbath",src:"audio/shabbath/04_Tefilah_ouverture_Shabbath.mp3"},
  {name:"Remerciement Téfilah et invitation à la lecture",src:"audio/shabbath/05_Remerciement_Tefilah_invitation_lecture.mp3"},
  {name:"Invitation à la lecture des passages de la semaine",src:"audio/shabbath/06_Invitation_lecture_passages_semaine.mp3"},
  {name:"Lecture de Tehillim 119:9-16",src:"audio/shabbath/07_Lecture_Tehillim_119_9-16.mp3"},
  {name:"Invitation à la lecture complémentaire — Yaḥuānān 8:31-32",src:"audio/shabbath/08_Invitation_lecture_Yahuanan_8-31-32.mp3"},
  {name:"Lecture de Yaḥuānān 8:31-32",src:"audio/shabbath/09_Lecture_Yahuanan_8-31-32.mp3"},
  {name:"Les Rappels de Yah — Questions & Réponses",src:"audio/shabbath/10_Les_Rappels_de_Yah_Questions_Reponses.mp3"},
  {name:"Transition vers le Chirat de méditation",src:"audio/shabbath/11_Transition_chirat_meditation.mp3"},
  {name:"Rapèl Yah yo fèm",src:"audio/shabbath/12_Rapel_Yah_yo_fem.mp3"},
  {name:"Introduire l'orateur du jour",src:"audio/shabbath/13_Introduire_orateur_du_jour.mp3"},
  {name:"Demeurer dans le Dabar — La marque du véritable Tal'mid",src:"audio/shabbath/14_DEMEURER_DANS_LE_DABAR.mp3"},
  {name:"Introduction au Chirat final",src:"audio/shabbath/15_Intro_Chirat_final.mp3"},
  {name:"Nan ki Katégori ou ye ?",src:"audio/shabbath/16_Nan_ki_Kategori_ou_ye.mp3"},
  {name:"Transition vers la Téfilah de clôture",src:"audio/shabbath/17_Transition_Tefilah_cloture.mp3"},
  {name:"Téfilah de clôture du Shabbath",src:"audio/shabbath/18_Tefilah_cloture_Shabbath.mp3"},
  {name:"Communications et clôture de l'ʿAbodah",src:"audio/shabbath/19_Communications_cloture_Abodah.mp3"}
];
let current=-1;
const audio=document.getElementById('audioPlayer');
function fmt(s){if(isNaN(s)||!isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')}
function buildPlaylist(){const el=document.getElementById('playlist');el.innerHTML='';tracks.forEach((t,i)=>{const div=document.createElement('div');div.className='track-item';div.id='ti-'+i;div.innerHTML='<div class="track-dot"></div><span>'+t.name+'</span>';div.onclick=()=>loadTrack(i);el.appendChild(div)})}
function loadTrack(idx){if(idx<0||idx>=tracks.length)return;if(current>=0){const p=document.getElementById('ti-'+current);if(p){p.classList.remove('active');p.classList.add('played')}}current=idx;audio.src=tracks[idx].src;document.getElementById('trackNum').textContent=(idx+1)+' / '+tracks.length;document.getElementById('trackName').textContent=tracks[idx].name;document.getElementById('progressBar').style.width='0%';document.getElementById('timeCurrent').textContent='0:00';document.getElementById('timeTotal').textContent='0:00';document.getElementById('btnPrev').disabled=idx===0;document.getElementById('btnNext').disabled=idx===tracks.length-1;const ti=document.getElementById('ti-'+idx);if(ti){ti.classList.add('active');ti.classList.remove('played')}audio.play().then(()=>{document.getElementById('playIcon').innerHTML='&#10074;&#10074;'}).catch(()=>{})}
function togglePlay(){if(current===-1){loadTrack(0);return}if(audio.paused){audio.play();document.getElementById('playIcon').innerHTML='&#10074;&#10074;'}else{audio.pause();document.getElementById('playIcon').innerHTML='&#9654;'}}
function nextTrack(){if(current<tracks.length-1)loadTrack(current+1)}
function prevTrack(){if(current>0)loadTrack(current-1)}
audio.addEventListener('timeupdate',()=>{if(audio.duration){document.getElementById('progressBar').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('timeCurrent').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration)}});
audio.addEventListener('ended',()=>{if(current<tracks.length-1){loadTrack(current+1)}else{document.getElementById('playIcon').innerHTML='&#9654;';document.getElementById('trackName').textContent='Service terminé — Shabbath Shalom ✦'}});
document.getElementById('progressWrap').addEventListener('click',e=>{if(!audio.duration)return;const rect=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration});
buildPlaylist();
function entrerAbodah(){
  document.getElementById('splash').style.display='none';
  loadTrack(0);
}
</script>
</body>
</html>
